<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>차사 - 단계 0 프로토타입</title>
    <style>
      /* 화면 전체를 게임 캔버스로 쓴다. 스크롤바/여백이 생기면 클릭 좌표가 틀어지므로 전부 제거 */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14161c; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      /* 데미지 숫자가 올라오는 투명 레이어. 마우스 클릭은 아래 캔버스로 통과시킨다(pointer-events: none) */
      #numbers { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .dmg {
        position: absolute; left: 0; top: 0;
        font-family: "Arial Black", "Malgun Gothic", sans-serif;
        font-weight: 900; color: #fff; white-space: nowrap;
        /* 검은 테두리를 text-shadow 로 흉내내서 어두운/밝은 바닥 어디서든 읽히게 한다 */
        text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 6px rgba(0,0,0,.6);
        will-change: transform, opacity; user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="numbers"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
