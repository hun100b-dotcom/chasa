<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!-- 폰: 화면 가득 쓰고 확대·당겨서 새로고침을 막는다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="TemplateData/favicon.ico">
  <link rel="icon" href="TemplateData/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    /* 화면 전체를 캔버스 하나로. 주소창이 줄었다 늘어도 맞도록 dvh 를 쓴다 */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0d14; overflow: hidden;
                 overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #unity-container { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0b0d14; touch-action: none; }
    /* 로딩 화면: 아트의 장면 그림(3장 중 무작위) 위에 아래쪽(화면 높이 90%)에 막대. 그림이 안 떠도 어두운 바탕에 막대는 보인다 */
    #loading { position: absolute; inset: 0; background: #0b0d14 center / cover no-repeat; color: #d8d2c4; font: 16px/1.5 sans-serif; z-index: 5; --bw: min(70vw, 720px); }
    #barbox { position: absolute; left: 50%; top: 90%; width: var(--bw); aspect-ratio: 1024 / 64; transform: translate(-50%, -50%); background: url(TemplateData/loading_bar_frame.png) center / 100% 100% no-repeat; }
    #clip { position: absolute; left: 0; top: 50%; height: 62.5%; transform: translateY(-50%); width: 0%; overflow: hidden; transition: width .2s; }
    #clip img { display: block; width: var(--bw); height: 100%; max-width: none; }   /* 채움 그림은 막대 전체 폭 그대로 두고 왼쪽부터 잘라 보인다 */
    #msg { position: absolute; left: 0; right: 0; top: calc(90% + 28px); font-size: 13px; opacity: .8; text-align: center; padding: 0 24px; text-shadow: 0 1px 3px #000; }
    /* 세로로 들고 있을 때: 가로로 돌려 달라는 안내(게임은 가로 화면 기준) */
    #rotate { display: none; position: absolute; inset: 0; z-index: 9; background: rgba(11,13,20,.94); color: #d8d2c4;
              align-items: center; justify-content: center; text-align: center; font: 18px/1.7 sans-serif; padding: 24px; }
    @media (orientation: portrait) and (max-width: 900px) { #rotate.on { display: flex; } }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="barbox"><div id="clip"><img src="TemplateData/loading_bar_fill.png" alt=""></div></div><div id="msg">불러오는 중… 처음 한 번만 오래 걸리고, 다음부터는 저장된 것을 씁니다.</div></div>
    <div id="rotate">폰을 가로로 돌려 주세요<br><small>가로 화면에서 가장 잘 보입니다</small></div>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    (function () {
      var canvas = document.querySelector("#unity-canvas");
      var params = new URLSearchParams(location.search);
      var q = (params.get("q") || "").toLowerCase();
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
      // 화면 해상도: 폰은 장치 픽셀을 다 쓰면 GPU 가 못 버틴다 → 배율을 제한한다(낮음 1.0 / 보통 1.25 / 높음 최대 2, 자동은 폰 1.5·PC 2)
      var dpr = window.devicePixelRatio || 1;
      var cap = q === "low" ? 1.0 : q === "mid" ? 1.25 : q === "high" ? 2.0 : (mobile ? 1.5 : 2.0);
      var config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(dpr, cap),
        matchWebGLToCanvasSize: true
      };
      var fill = document.getElementById("clip"), loading = document.getElementById("loading"), msg = document.getElementById("msg");
      loading.style.backgroundImage = "url(TemplateData/loading_" + (1 + Math.floor(Math.random() * 3)) + ".jpg)";   // 구역 그림 3장 중 하나
      var rot = document.getElementById("rotate"); if (mobile) rot.classList.add("on");
      createUnityInstance(canvas, config, function (p) { fill.style.width = (p * 100) + "%"; })
        .then(function (inst) { loading.style.display = "none"; window.unityInstance = inst; })
        .catch(function (e) { msg.textContent = "불러오지 못했습니다: " + e; });
    })();
  </script>
</body>
</html>
