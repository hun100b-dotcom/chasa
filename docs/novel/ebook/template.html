<title>{{DOC_TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Song+Myung&display=swap">
<style>
/* 레이아웃: 명부 한 권 — 세로쓰기 표지 → 인(도장)으로 읽은 상태를 보여 주는 목차 → 한 쪽씩 넘기는 본문 */
/* 왜 이런 색인가: 새벽빛 한지(바탕) · 먹(글자) · 혼불 청록(강조) · 인주(도장) — 소설 속 사물에서 가져왔다 */
:root {
  --paper: #ECEEE9;        /* 새벽 한지: 푸른 기가 조금 도는 흰빛 */
  --paper-2: #E2E5DF;      /* 쪽지·막대 바탕 */
  --ink: #1E2327;          /* 먹 */
  --ink-soft: #5A6268;     /* 엷은 먹 (머리말·쪽 번호) */
  --rule: #C6CCC7;         /* 괘선 */
  --soul: #2A7A73;         /* 혼불 청록 (강조색) */
  --soul-hi: #8FE0D3;      /* 혼불 한가운데 */
  --seal: #A9291F;         /* 인주 */
  --mem: #24635D;          /* 기억 한 줄 */
  --f-display: "Song Myung", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --f-body: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --f-ui: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --fs: 17.5px;            /* 본문 글자 크기 (설정에서 바뀜) */
  --lh: 1.9;               /* 줄 간격: 한글 소설은 넉넉해야 눈이 덜 피곤하다 */
}
/* 밤: 기기 설정이 어두울 때 (책 설정을 '낮'으로 고르지 않은 경우) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-book="day"]) {
    --paper: #11151A; --paper-2: #192027; --ink: #CFD4CC; --ink-soft: #8E9893;
    --rule: #2A333A; --soul: #5CBFB2; --soul-hi: #B9F2E8; --seal: #D35A4D; --mem: #7CCBBF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-book="day"]) {
  --paper: #11151A; --paper-2: #192027; --ink: #CFD4CC; --ink-soft: #8E9893;
  --rule: #2A333A; --soul: #5CBFB2; --soul-hi: #B9F2E8; --seal: #D35A4D; --mem: #7CCBBF;
  color-scheme: dark;
}
/* 책에서 '밤'을 직접 고르면 기기 설정과 상관없이 밤 */
:root[data-book="night"] {
  --paper: #11151A; --paper-2: #192027; --ink: #CFD4CC; --ink-soft: #8E9893;
  --rule: #2A333A; --soul: #5CBFB2; --soul-hi: #B9F2E8; --seal: #D35A4D; --mem: #7CCBBF;
  color-scheme: dark;
}
:root[data-book="day"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--soul); outline-offset: 2px; }

/* ───────── 표지 + 목차 (평범하게 스크롤되는 첫 화면) ───────── */
.home {
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; justify-items: center; gap: 28px;
}
.top-tools { width: min(100%, 34rem); display: flex; justify-content: flex-end; }
.chip-row { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.chip-row button {
  border: 0; background: transparent; padding: 6px 12px; font-family: var(--f-ui); font-size: 13px; cursor: pointer; color: var(--ink-soft);
}
.chip-row button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.cover {
  width: min(100%, 22rem); aspect-ratio: 3 / 4; max-width: 100%;
  border: 1px solid var(--rule); background: var(--paper-2);
  position: relative; display: grid; grid-template-columns: 1fr auto auto; align-items: start;
  padding: 34px 30px 30px; gap: 18px; overflow: hidden;
}
/* 표지 왼쪽 위 혼불: 이 화면에서 움직이는 것은 이것 하나 */
.soulfire {
  position: absolute; left: 30px; top: 34px; width: 12px; height: 12px; border-radius: 50%;
  background: radial-gradient(circle, var(--soul-hi) 0%, var(--soul) 55%, transparent 72%);
  box-shadow: 0 0 22px 8px color-mix(in srgb, var(--soul) 30%, transparent);
  animation: breathe 5.2s ease-in-out infinite;
}
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.25); opacity: 1; } }
.cover-title {
  writing-mode: vertical-rl; font-family: var(--f-display); font-size: clamp(64px, 22vw, 96px);
  line-height: 1; letter-spacing: .08em; margin: 0; color: var(--ink); grid-column: 3;
}
.cover-sub {
  writing-mode: vertical-rl; font-family: var(--f-display); font-size: 17px; letter-spacing: .3em;
  color: var(--ink-soft); margin: 6px 0 0; grid-column: 2;
}
.seal {
  display: inline-grid; place-items: center; border: 2px solid var(--seal); color: var(--seal);
  font-family: var(--f-display); line-height: 1.05; text-align: center;
}
.cover .seal {
  position: absolute; right: 30px; bottom: 30px; width: 30px; min-height: 62px; font-size: 13px; padding: 5px 0;
  writing-mode: vertical-rl; white-space: nowrap; letter-spacing: .02em;
}
/* 세로쓰기 안의 숫자는 눕지 않게 세운다 */
.tcu { text-combine-upright: all; -webkit-text-combine: horizontal; }
.cover-epi {
  position: absolute; left: 30px; bottom: 30px; right: 96px; margin: 0;
  font-size: 14px; color: var(--ink-soft); line-height: 1.7; word-break: keep-all;
}
.meta { margin: 0; font-family: var(--f-ui); font-size: 13px; color: var(--ink-soft); text-align: center; letter-spacing: .02em; text-wrap: balance; }

.cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: min(100%, 34rem); }
.btn {
  border: 1px solid var(--ink); background: transparent; padding: 12px 18px; border-radius: 4px;
  font-family: var(--f-ui); font-size: 15px; cursor: pointer; min-height: 44px;
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn small { display: block; font-size: 12px; opacity: .75; margin-top: 2px; }

.toc { width: min(100%, 34rem); }
.toc h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0 0 6px; letter-spacing: .1em; }
.legend { font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.legend .seal { width: 14px; height: 14px; font-size: 0; vertical-align: -2px; margin-right: 5px; }
.toc ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.toc li { border-bottom: 1px solid var(--rule); }
.toc a {
  display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center;
  padding: 12px 2px; color: inherit; text-decoration: none; min-height: 56px;
}
.toc a:hover .t-title { color: var(--soul); }
.toc li .seal { width: 40px; height: 40px; font-size: 13px; }
/* 인 상태 = 읽은 상태. 소설 속 명부처럼: 또렷(다 읽음) · 흐림(읽는 중) · 빈자리(아직) */
.toc li .seal[data-state="none"], .legend .s-none { border: 1.5px dashed var(--rule); color: var(--ink-soft); }
.toc li .seal[data-state="blur"], .legend .s-blur { border-color: var(--seal); opacity: .55; box-shadow: 0 0 3px var(--seal); }
.toc li .seal[data-state="clear"], .legend .s-clear { border-color: var(--seal); color: var(--seal); }
.t-main { min-width: 0; }
.t-label { display: block; font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); }
.t-title { display: block; font-size: 17px; line-height: 1.4; word-break: keep-all; }
.t-side { font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; display: grid; justify-items: end; gap: 2px; }
/* 목차의 쪽 번호: 그 장이 시작하는 쪽 (이 기기의 화면·글자 크기로 센 값) */
.t-side .t-pg { font-size: 14px; color: var(--ink); }
.toc-total { font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); margin: -4px 0 10px; }
.toc li.toc-part {
  border-bottom: 1px solid var(--rule); padding: 22px 2px 8px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.toc li.toc-part:first-child { padding-top: 10px; }
.toc .tp-num { font-family: var(--f-ui); font-size: 12px; letter-spacing: .2em; color: var(--ink-soft); }
.toc .tp-name { font-family: var(--f-display); font-size: 19px; letter-spacing: .12em; }
.toc .tp-side { margin-left: auto; font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); }
.note-small { width: min(100%, 34rem); font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); margin: 0; line-height: 1.6; }

/* ───────── 읽기 화면 (화면 전체를 덮는 한 장) ───────── */
.reader { position: fixed; inset: 0; background: var(--paper); z-index: 5; display: grid; grid-template-rows: auto 1fr auto; }
.runhead, .folio {
  font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); text-align: center; letter-spacing: .04em;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 20px;   /* 줄 높이를 못 박아 둔다: 안에 든 글자(숫자·한글·점)에 따라 높이가 1~2px씩 달라지면 쪽 수가 어긋난다 */
}
.runhead { padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: 8px; }
/* 쪽 번호(아래 가운데): 종이책처럼 "몇 쪽 / 전체 몇 쪽". 지금 쪽 숫자만 먹빛으로 조금 크게 */
.folio { padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); font-size: 13px; font-variant-numeric: tabular-nums; }
.folio b { font-weight: 400; font-size: 15px; line-height: 1; color: var(--ink); letter-spacing: .02em; }
/* 쪽 세기용 보이지 않는 판: 읽기 화면과 똑같은 틀에 장을 하나씩 깔아 쪽 수만 센다(눈에는 안 보이고 누를 수도 없다) */
.reader.measure { visibility: hidden; pointer-events: none; z-index: -1; }
.frame {
  position: relative; overflow: hidden; width: 100%; max-width: 42rem; margin-inline: auto; min-height: 0;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  touch-action: pan-y;
}
.flow {
  height: 100%; column-fill: auto; font-size: var(--fs); line-height: var(--lh);
  transition: transform .28s ease; will-change: transform;
}
.reader[data-mode="scroll"] .frame { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.reader[data-mode="scroll"] .flow { height: auto; columns: auto; transition: none; transform: none !important; padding-bottom: 3em; }

/* 본문 조판 */
.flow p { margin: 0 0 .42em; text-indent: 1em; word-break: keep-all; overflow-wrap: anywhere; text-wrap: pretty; orphans: 2; widows: 2; }
.ch-head { padding-top: 14vh; margin-bottom: 2.2em; break-after: avoid; break-inside: avoid; }
.ch-head .part { font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); letter-spacing: .12em; margin: 0 0 18px; text-indent: 0; }
.ch-head .seal { width: 52px; height: 52px; font-size: 15px; margin-bottom: 16px; }
.ch-head h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.75em; line-height: 1.3; margin: 0; text-wrap: balance; word-break: keep-all; }
.flow p.mem {
  text-indent: 0; margin: 1.1em 0; padding-left: .9em; border-left: 2px solid var(--soul); color: var(--mem);
  break-inside: avoid;
}
.flow .slip {
  margin: 1.4em .2em; padding: .85em 1em; background: var(--paper-2); border: 1px solid var(--rule); border-top: 2px solid var(--ink);
  font-size: .94em; break-inside: avoid;
}
.flow .slip p { text-indent: 0; margin: 0; }
.flow .brk { text-align: center; text-indent: 0; letter-spacing: .6em; color: var(--ink-soft); margin: 1.3em 0; break-after: avoid; }
.ch-end { text-align: center; margin-top: 2.4em; break-inside: avoid; }
.ch-end .seal { width: 26px; height: 26px; font-size: 0; opacity: .8; }
.ch-end .next {
  display: block; margin: 1.6em auto 0; border: 1px solid var(--rule); background: transparent; padding: 10px 14px;
  font-family: var(--f-ui); font-size: 14px; cursor: pointer; border-radius: 4px; min-height: 44px;
}
.ch-end .fin { font-family: var(--f-display); font-size: 1.15em; margin: 1.6em 0 0; text-indent: 0; letter-spacing: .1em; }
.ch-end .wip { font-family: var(--f-ui); font-size: 13px; color: var(--ink-soft); margin: .7em 0 0; text-indent: 0; }
/* 부 표제지: 새 부의 첫 장 앞에 한 쪽을 통째로 쓴다(넘겨 읽기에서는 높이를 한 쪽 높이와 똑같이 맞춰 다음 글이 다음 쪽에서 시작한다) */
.part-open { text-align: center; padding-top: 22vh; margin: 0; box-sizing: border-box; break-inside: avoid; }
.reader[data-mode="page"] .part-open { height: var(--ph, auto); overflow: hidden; }
.reader[data-mode="scroll"] .part-open { padding-bottom: 12vh; }
.flow .part-open p { text-indent: 0; margin: 0; }
.part-open .po-num { font-family: var(--f-ui); font-size: 13px; letter-spacing: .4em; color: var(--ink-soft); }
.part-open .po-name { font-family: var(--f-display); font-size: 2.4em; letter-spacing: .24em; margin-top: 14px !important; }
.part-open .po-rule { display: block; width: 36px; height: 2px; background: var(--seal); margin: 26px auto 0; }
.part-open .po-epi { font-size: .95em; color: var(--ink-soft); margin-top: 26px !important; }

/* 화면 가운데를 누르면 나오는 막대 */
.bar {
  position: fixed; left: 0; right: 0; z-index: 8; background: var(--paper-2); display: flex; align-items: center; gap: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  transition: transform .2s ease, visibility .2s; visibility: hidden;
}
.bar.top { top: 0; transform: translateY(-100%); border-bottom: 1px solid var(--rule); padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px; }
.bar.bottom { bottom: 0; transform: translateY(100%); border-top: 1px solid var(--rule); padding-top: 10px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); flex-wrap: wrap; }
.reader.ui .bar { transform: none; visibility: visible; }
.bar .title { flex: 1; min-width: 0; text-align: center; font-family: var(--f-ui); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibtn {
  border: 1px solid transparent; background: transparent; min-width: 44px; min-height: 44px; padding: 6px 10px; border-radius: 4px;
  font-family: var(--f-ui); font-size: 14px; cursor: pointer;
}
.ibtn:hover { border-color: var(--rule); }
.scrub { flex: 1 1 160px; min-width: 0; display: flex; align-items: center; gap: 10px; font-family: var(--f-ui); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.scrub input { flex: 1; min-width: 0; accent-color: var(--soul); }

/* 글자·배경 설정 */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--paper-2); border-top: 1px solid var(--rule);
  padding-top: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; justify-items: center;
}
.sheet .row { width: min(100%, 26rem); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--f-ui); font-size: 14px; }
.sheet .size { display: inline-flex; align-items: center; gap: 6px; }
.sheet .size output { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
.sheet .done { justify-self: center; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); transform: translateX(-50%); z-index: 10;
  background: var(--ink); color: var(--paper); font-family: var(--f-ui); font-size: 13px; padding: 8px 14px; border-radius: 999px;
  opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
}
.toast.on { opacity: .92; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.frame:focus { outline: none; }

@media (prefers-reduced-motion: reduce) {
  .soulfire { animation: none; }
  .flow, .bar, .toast { transition: none; }
}
</style>

<main class="home" id="home">
  <div class="top-tools">
    <div class="chip-row" role="group" aria-label="배경">
      <button type="button" data-theme-pick="day" aria-pressed="false">낮</button>
      <button type="button" data-theme-pick="night" aria-pressed="false">밤</button>
      <button type="button" data-theme-pick="auto" aria-pressed="true">기기 설정</button>
    </div>
  </div>

  <section class="cover" aria-label="표지">
    <span class="soulfire" aria-hidden="true"></span>
    <p class="cover-epi">물소리가 먼저 있었다.</p>
    <p class="cover-sub">{{COVER_SUB}}</p>
    <h1 class="cover-title">차사</h1>
    <span class="seal" aria-hidden="true">{{COVER_SEAL}}</span>
  </section>

  <p class="meta">{{META}}</p>

  <div class="cta">
    <button type="button" class="btn primary" id="resume" hidden>이어 읽기<small id="resume-where"></small></button>
    <button type="button" class="btn" id="start">처음부터 읽기</button>
  </div>

  <nav class="toc" aria-labelledby="toc-h">
    <h2 id="toc-h">목차</h2>
    <p class="legend" aria-hidden="true">
      <span><span class="seal s-clear"></span>다 읽음</span>
      <span><span class="seal s-blur"></span>읽는 중</span>
      <span><span class="seal s-none"></span>아직</span>
    </p>
    <p class="toc-total" id="toc-total" hidden></p>
    <ol id="toc-list">
{{TOC_ROWS}}
    </ol>
  </nav>

  <p class="note-small">읽던 자리와 글자 크기는 지금 쓰는 이 기기의 브라우저에만 저장됩니다. 다른 기기에서 열면 처음부터 시작합니다.</p>
</main>

<div class="reader" id="reader" hidden data-mode="page">
  <div class="runhead" id="runhead" aria-hidden="true"></div>
  <div class="frame" id="frame" tabindex="-1">
    <article class="flow" id="flow" lang="ko"></article>
  </div>
  <div class="folio" id="folio" aria-live="polite"></div>

  <div class="bar top" id="bar-top">
    <button type="button" class="ibtn" id="to-toc" aria-label="목차로">목차</button>
    <div class="title" id="bar-title"></div>
    <button type="button" class="ibtn" id="open-sheet" aria-label="글자와 배경 설정">가</button>
  </div>
  <div class="bar bottom" id="bar-bottom">
    <button type="button" class="ibtn" id="prev-ch" aria-label="앞 장">‹ 앞 장</button>
    <label class="scrub" for="scrub"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="이 장 안에서 쪽 옮기기"><span id="scrub-out"></span></label>
    <button type="button" class="ibtn" id="next-ch" aria-label="다음 장">다음 장 ›</button>
  </div>

  <div class="sheet" id="sheet" hidden role="dialog" aria-label="글자와 배경">
    <div class="row"><span>글자 크기</span>
      <span class="size"><button type="button" class="ibtn" id="fs-down" aria-label="글자 작게">가−</button><output id="fs-out">5 / 7</output><button type="button" class="ibtn" id="fs-up" aria-label="글자 크게">가+</button></span>
    </div>
    <div class="row"><span>배경</span>
      <div class="chip-row" role="group" aria-label="배경">
        <button type="button" data-theme-pick="day" aria-pressed="false">낮</button>
        <button type="button" data-theme-pick="night" aria-pressed="false">밤</button>
        <button type="button" data-theme-pick="auto" aria-pressed="true">기기 설정</button>
      </div>
    </div>
    <div class="row"><span>읽는 방식</span>
      <div class="chip-row" role="group" aria-label="읽는 방식">
        <button type="button" data-mode-pick="page" aria-pressed="true">넘겨 읽기</button>
        <button type="button" data-mode-pick="scroll" aria-pressed="false">내려 읽기</button>
      </div>
    </div>
    <button type="button" class="btn done" id="close-sheet">닫기</button>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<!-- 쪽 세기용 보이지 않는 판 (읽기 화면과 같은 틀) -->
<div class="reader measure" id="measure" data-mode="page" aria-hidden="true">
  <div class="runhead">·</div>
  <div class="frame"><article class="flow" lang="ko"></article></div>
  <div class="folio"><b>1</b> / 1쪽</div>
</div>

<script type="application/json" id="book-data">{{BOOK_JSON}}</script>
<script>
/* ───────────────────────────────────────────────
   《차사》 전자책 읽기 화면
   - 넘겨 읽기: 본문을 화면 폭만 한 '단(column)'으로 잘라 한 쪽씩 옆으로 민다
     (CSS 다단 기능을 쓴다. 쪽 수는 글자 크기·화면 크기에 따라 그때그때 다시 센다)
   - 내려 읽기: 그냥 위아래로 스크롤
   - 읽던 자리·글자 크기·배경은 이 기기의 localStorage(브라우저 저장소)에 둔다
   ─────────────────────────────────────────────── */
(function () {
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book-data").textContent);
  var CH = BOOK.chapters;
  var KEY = "chasa-ebook-part1-v1";
  var SIZES = [15, 16, 17, 17.5, 18.5, 20, 22];   /* 글자 크기 단계(px) */

  var $ = function (id) { return document.getElementById(id); };
  var home = $("home"), reader = $("reader"), frame = $("frame"), flow = $("flow");

  /* 저장소는 사생활 보호 모드 등에서 막힐 수 있다 → 실패해도 책은 읽히게 try/catch */
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 저장 못 해도 읽기는 계속 */ } }

  var saved = load();
  var S = {
    ch: typeof saved.ch === "number" ? saved.ch : -1,   /* 읽던 장 (-1 = 아직 안 읽음) */
    frac: typeof saved.frac === "number" ? saved.frac : 0, /* 그 장에서 읽은 비율 0~1 */
    fs: typeof saved.fs === "number" ? saved.fs : 3,
    theme: saved.theme || "auto",
    /* 이 판부터 넘겨 읽기(쪽 나누기)가 기본. 예전에 내려 읽기를 골라 두었어도 이번 한 번은 넘겨 읽기로 연다.
       (pv = 이 설정을 바꾼 판 번호. 다시 내려 읽기를 고르면 그 뒤로는 그대로 둔다) */
    mode: (saved.mode === "scroll" && saved.pv !== 2) ? "page" : (saved.mode || "page"),
    pv: 2,
    read: saved.read || {},       /* 다 읽은 장 */
    prog: saved.prog || {},       /* 장별로 가장 멀리 읽은 비율 */
    pgc: saved.pgc || null        /* 지난번에 센 장별 쪽 수(같은 화면·글자 크기면 바로 쓴다) */
  };
  var cur = { ch: 0, page: 0, pages: 1, step: 0 };
  var BOOK_CHARS = CH.reduce(function (a, c) { return a + c.chars; }, 0);   /* 원고가 바뀌면 쪽 수를 다시 세려고 */

  /* ───── 배경(낮/밤) ───── */
  function applyTheme() {
    var root = document.documentElement;
    if (S.theme === "day") root.setAttribute("data-book", "day");
    else if (S.theme === "night") root.setAttribute("data-book", "night");
    else root.removeAttribute("data-book");
    document.querySelectorAll("[data-theme-pick]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-pick") === S.theme));
    });
  }
  document.querySelectorAll("[data-theme-pick]").forEach(function (b) {
    b.addEventListener("click", function () { S.theme = b.getAttribute("data-theme-pick"); applyTheme(); save(); });
  });

  /* ───── 목차의 인 상태 + 이어 읽기 단추 ───── */
  function sealState(i) {
    if (S.read[i]) return "clear";
    if ((S.prog[i] || 0) > 0.01 || S.ch === i) return "blur";
    return "none";
  }
  function refreshHome() {
    var ok = pgReady();
    document.querySelectorAll("#toc-list a").forEach(function (a) {
      var i = Number(a.getAttribute("data-ch"));
      var st = sealState(i);
      a.querySelector(".seal").setAttribute("data-state", st);
      var side = a.querySelector(".t-side");
      var stText = st === "clear" ? "다 읽음" : st === "blur" ? Math.round((S.prog[i] || 0) * 100) + "%" : "약 " + CH[i].mins + "분";
      /* 쪽 수를 다 셌으면 종이책 목차처럼 그 장이 시작하는 쪽을 위에 단다 */
      side.innerHTML = (ok ? '<span class="t-pg">' + PG.starts[i] + "쪽</span>" : "") + "<span>" + stText + "</span>";
    });
    var tt = $("toc-total");
    if (ok) { tt.hidden = false; tt.textContent = "전체 " + PG.total + "쪽 · 쪽 수는 이 화면과 글자 크기로 센 것입니다"; }
    else tt.hidden = true;
    var r = $("resume");
    if (S.ch >= 0 && CH[S.ch]) {
      r.hidden = false;
      var where = ok ? (PG.starts[S.ch] + Math.round(S.frac * (PG.counts[S.ch] - 1))) + "쪽" : Math.round(S.frac * 100) + "%";
      $("resume-where").textContent = CH[S.ch].label + " 「" + CH[S.ch].title + "」 · " + where;
      $("start").textContent = "처음부터";
    } else {
      r.hidden = true;
      $("start").textContent = "처음부터 읽기";
    }
  }

  /* ───── 장 하나의 화면 글(HTML)을 만든다: 읽기 화면과 쪽 세기 판이 같은 것을 쓴다 ───── */
  function chapterHTML(i) {
    var c = CH[i];
    var opener = "";
    if (c.first && c.pi > 0) {
      var P = BOOK.parts[c.pi];
      opener = '<section class="part-open" aria-label="' + P.num + ' ' + P.name + '"><p class="po-num">' + P.num + '</p>' +
        '<p class="po-name">' + P.name + '</p><span class="po-rule" aria-hidden="true"></span>' +
        (P.epi ? '<p class="po-epi">' + P.epi + '</p>' : '') + '</section>';
    }
    var html = opener + '<header class="ch-head"><p class="part">' + c.part + '</p>' +
      '<span class="seal" aria-hidden="true">' + c.mark + '</span>' +
      '<h1><span class="sr">' + c.label + ' </span>' + c.title + '</h1></header>' + c.html;
    var end = '<footer class="ch-end"><span class="seal" aria-hidden="true"></span>';
    var P = BOOK.parts[c.pi];
    if (i < CH.length - 1) {
      var n = CH[i + 1];
      if (n.pi !== c.pi) {
        var NP = BOOK.parts[n.pi];
        end += '<p class="fin">' + P.short + ' 「' + P.name + '」 끝</p>';
        end += '<button type="button" class="next" data-go="' + (i + 1) + '">다음: ' + NP.short + ' 「' + NP.name + '」 · ' + n.label + ' 「' + n.title + '」 ›</button>';
      } else {
        end += '<button type="button" class="next" data-go="' + (i + 1) + '">다음: ' + n.label + ' 「' + n.title + '」 ›</button>';
      }
    } else if (P.written < P.planned) {
      end += '<p class="fin">' + P.short + ' 「' + P.name + '」은 여기까지 썼습니다</p>';
      end += '<p class="wip">남은 ' + (P.planned - P.written) + '장은 다 쓰는 대로 이 책 뒤에 이어 붙습니다.</p>';
      end += '<button type="button" class="next" data-go="toc">목차로 돌아가기</button>';
    } else {
      end += '<p class="fin">' + P.short + ' 「' + P.name + '」 끝</p><button type="button" class="next" data-go="toc">목차로 돌아가기</button>';
    }
    end += "</footer>";
    return html + end;
  }

  /* ───── 장 하나를 읽기 화면에 깐다 ───── */
  function renderChapter(i) {
    var c = CH[i];
    flow.innerHTML = chapterHTML(i);
    $("runhead").textContent = c.label + " · " + c.title;
    $("bar-title").textContent = c.label + " 「" + c.title + "」";
    $("prev-ch").disabled = i === 0;
    $("next-ch").disabled = i === CH.length - 1;
  }

  /* ───── 넘겨 읽기: 쪽 수 세기 ─────
     fr = 틀(화면), fl = 그 안의 글. 글을 틀 폭만 한 단으로 잘라 몇 단(= 몇 쪽)이 나오는지 센다. */
  function paginate(fr, fl) {
    var cs = getComputedStyle(fr);
    var padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
    var W = fr.clientWidth - padL - padR;         /* 한 쪽의 글 폭 */
    var H = fr.clientHeight;                       /* 한 쪽의 높이 */
    var G = padL + padR;                           /* 쪽 사이 간격 = 양옆 여백의 합 → 옆 쪽이 화면에 비치지 않는다 */
    fl.style.width = W + "px";
    fl.style.height = H + "px";
    fl.style.setProperty("--ph", H + "px");
    fl.style.columnWidth = W + "px";
    fl.style.columnGap = G + "px";
    var step = W + G;
    var last = fl.lastElementChild;
    var x = last ? last.getBoundingClientRect().left - fl.getBoundingClientRect().left : 0;
    return { step: step, pages: Math.max(1, Math.floor((x + 1) / step) + 1) };
  }
  function layout() {
    if (S.mode !== "page") { cur.pages = 1; return; }
    var r = paginate(frame, flow);
    cur.step = r.step; cur.pages = r.pages;
    /* 실제로 깐 장의 쪽 수가 미리 센 것과 다르면(글꼴이 늦게 도착한 경우 등) 그 자리에서 바로잡는다 */
    if (pgReady() && PG.counts[cur.ch] !== cur.pages) { PG.counts[cur.ch] = cur.pages; setCounts(PG.counts); }
  }

  /* ───── 책 전체 쪽 번호 ─────
     넘겨 읽기는 장마다 따로 쪽을 나눈다. 책 전체에서 몇 쪽인지 알려면 모든 장을 같은 틀에 한 번씩
     깔아 보고 쪽 수를 더해야 한다. 보이지 않는 판(#measure)에 장을 하나씩 깔아 센다.
     한꺼번에 다 세면 화면이 멈칫하므로, 조금 세고 쉬고를 되풀이한다.
     쪽 수는 화면 크기와 글자 크기에 따라 달라진다 → 그 둘이 바뀌면 다시 센다. */
  var PG = { key: "", counts: null, starts: null, total: 0, token: 0 };
  var mframe = document.querySelector("#measure .frame"), mflow = document.querySelector("#measure .flow");
  function pgKey() { return [S.fs, window.innerWidth, window.innerHeight, CH.length, BOOK_CHARS].join("|"); }
  /* 한 번이라도 다 셌으면 쪽 번호를 보여 준다. 화면·글자 크기가 바뀌어 다시 세는 1~2초 동안은
     지난 값을 그대로 두었다가, 다 세면 새 값으로 바꾼다(그사이 쪽 번호가 사라졌다 나타나지 않게) */
  function pgReady() { return !!PG.starts; }
  function setCounts(counts) {
    var starts = [], acc = 1;                      /* 프롤로그 첫 쪽이 1쪽 */
    for (var k = 0; k < counts.length; k++) { starts.push(acc); acc += counts[k]; }
    PG.counts = counts; PG.starts = starts; PG.total = acc - 1;
  }
  function measureAll() {
    var token = ++PG.token, key = pgKey(), counts = [], i = 0;
    function step() {
      if (token !== PG.token) return;              /* 세는 사이에 다시 세라는 신호가 오면 이번 셈은 버린다 */
      var t0 = Date.now();
      while (i < CH.length && Date.now() - t0 < 24) {
        mflow.innerHTML = chapterHTML(i);
        counts.push(paginate(mframe, mflow).pages);
        i++;
      }
      if (i < CH.length) { setTimeout(step, 0); return; }
      mflow.innerHTML = "";
      PG.key = key; setCounts(counts);
      /* 읽기 화면에 지금 깔린 장은 실제로 센 값이 더 정확하다 */
      if (!reader.hidden && S.mode === "page" && PG.counts[cur.ch] !== cur.pages) { PG.counts[cur.ch] = cur.pages; setCounts(PG.counts); }
      S.pgc = { key: key, counts: PG.counts.slice() }; save();
      refreshHome();
      if (!reader.hidden) paintFolio();
    }
    setTimeout(step, 0);
  }
  var mt = 0;
  function measureSoon() { clearTimeout(mt); mt = setTimeout(measureAll, 350); }

  /* 지금 책 전체에서 몇 쪽인가 (아직 다 못 셌으면 null) */
  function pageNow() {
    if (!pgReady()) return null;
    var inCh = S.mode === "page" ? cur.page : Math.round(fracNow() * (PG.counts[cur.ch] - 1));
    return PG.starts[cur.ch] + Math.min(inCh, PG.counts[cur.ch] - 1);
  }
  /* 아래 쪽 번호와 막대의 쪽 표시를 고쳐 단다 */
  function paintFolio() {
    var g = pageNow(), folio = $("folio"), out = $("scrub-out");
    if (g !== null) {
      folio.innerHTML = "<b>" + g + "</b> / " + PG.total + "쪽";
      out.textContent = g + "쪽" + (S.mode === "page" ? " · 이 장 " + (cur.page + 1) + "/" + cur.pages : "");
    } else if (S.mode === "page") {
      folio.textContent = "이 장 " + (cur.page + 1) + " / " + cur.pages + "쪽";
      out.textContent = (cur.page + 1) + "/" + cur.pages;
    } else {
      var f = Math.round(fracNow() * 100);
      folio.textContent = f + "%";
      out.textContent = f + "%";
    }
  }
  function clearLayout() {
    flow.style.width = flow.style.height = flow.style.columnWidth = flow.style.columnGap = "";
    flow.style.removeProperty("--ph");
  }

  function fracNow() {
    if (S.mode === "page") return cur.pages > 1 ? cur.page / (cur.pages - 1) : 0;
    var max = frame.scrollHeight - frame.clientHeight;
    return max > 0 ? Math.min(1, frame.scrollTop / max) : 0;
  }

  function show(animate) {
    if (S.mode === "page") {
      if (!animate) flow.style.transition = "none";
      flow.style.transform = "translateX(" + (-cur.page * cur.step) + "px)";
      if (!animate) { void flow.offsetWidth; flow.style.transition = ""; }
      $("scrub").max = String(cur.pages - 1);
      $("scrub").value = String(cur.page);
    } else {
      $("scrub").max = "100";
      $("scrub").value = String(Math.round(fracNow() * 100));
    }
    paintFolio();
    remember();
  }

  var saveTimer = 0;
  function remember() {
    var f = fracNow();
    S.ch = cur.ch; S.frac = f;
    S.prog[cur.ch] = Math.max(S.prog[cur.ch] || 0, f);
    if (f >= 0.985) S.read[cur.ch] = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 250);
  }

  /* 장 열기: frac = 그 장의 어느 비율에서 시작할지 (1이면 마지막 쪽) */
  function openChapter(i, frac) {
    cur.ch = Math.max(0, Math.min(CH.length - 1, i));
    home.hidden = true; reader.hidden = false;
    reader.setAttribute("data-mode", S.mode);
    renderChapter(cur.ch);
    relayout(frac || 0);
    frame.focus({ preventScroll: true });
  }
  function relayout(frac) {
    if (S.mode === "page") {
      frame.scrollTop = 0;
      layout();
      cur.page = Math.round((frac || 0) * (cur.pages - 1));
      show(false);
    } else {
      clearLayout();
      var max = frame.scrollHeight - frame.clientHeight;
      frame.scrollTop = (frac || 0) * max;
      show(false);
    }
  }

  function next() {
    if (S.mode !== "page") return;
    if (cur.page < cur.pages - 1) { cur.page++; show(true); }
    else if (cur.ch < CH.length - 1) { openChapter(cur.ch + 1, 0); }
    else { toast(BOOK.endToast || "여기까지입니다"); }
  }
  function prev() {
    if (S.mode !== "page") return;
    if (cur.page > 0) { cur.page--; show(true); }
    else if (cur.ch > 0) { openChapter(cur.ch - 1, 1); }
  }

  function toHome() {
    save();
    reader.hidden = true; home.hidden = false;
    setUI(false); $("sheet").hidden = true;
    refreshHome();
    var li = document.querySelector('#toc-list a[data-ch="' + cur.ch + '"]');
    if (li) li.scrollIntoView({ block: "center" });
  }

  /* ───── 조작: 누르기·밀기·키보드 ───── */
  function setUI(on) { reader.classList.toggle("ui", on); }
  var downX = 0, downY = 0, downT = 0, tracking = false;
  frame.addEventListener("pointerdown", function (e) { tracking = true; downX = e.clientX; downY = e.clientY; downT = Date.now(); });
  frame.addEventListener("pointerup", function (e) {
    if (!tracking) return; tracking = false;
    if (e.target.closest && e.target.closest("button, a")) return;
    var dx = e.clientX - downX, dy = e.clientY - downY;
    if (S.mode === "page" && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      if (dx < 0) next(); else prev();      /* 왼쪽으로 밀면 다음 쪽 */
      return;
    }
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10 || Date.now() - downT > 600) return;   /* 스크롤·길게 누르기는 무시 */
    var r = frame.getBoundingClientRect();
    var p = (e.clientX - r.left) / r.width;
    if (reader.classList.contains("ui")) { setUI(false); $("sheet").hidden = true; return; }
    if (S.mode === "page" && p < 0.3) prev();
    else if (S.mode === "page" && p > 0.7) next();
    else setUI(true);
  });
  frame.addEventListener("pointercancel", function () { tracking = false; });
  frame.addEventListener("scroll", function () { if (S.mode === "scroll") show(false); }, { passive: true });

  document.addEventListener("keydown", function (e) {
    if (reader.hidden) return;
    if (e.key === "Escape") { if (!$("sheet").hidden) { $("sheet").hidden = true; } else setUI(!reader.classList.contains("ui")); return; }
    if (S.mode !== "page") return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !e.shiftKey)) { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp" || (e.key === " " && e.shiftKey)) { e.preventDefault(); prev(); }
  });

  flow.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-go]");
    if (!b) return;
    var go = b.getAttribute("data-go");
    if (go === "toc") toHome(); else openChapter(Number(go), 0);
  });

  $("to-toc").addEventListener("click", toHome);
  $("prev-ch").addEventListener("click", function () { if (cur.ch > 0) openChapter(cur.ch - 1, 0); });
  $("next-ch").addEventListener("click", function () { if (cur.ch < CH.length - 1) openChapter(cur.ch + 1, 0); });
  $("scrub").addEventListener("input", function () {
    var v = Number($("scrub").value);
    if (S.mode === "page") { cur.page = v; show(false); }
    else { var max = frame.scrollHeight - frame.clientHeight; frame.scrollTop = v / 100 * max; }
  });

  $("open-sheet").addEventListener("click", function () { $("sheet").hidden = !$("sheet").hidden; });
  $("close-sheet").addEventListener("click", function () { $("sheet").hidden = true; setUI(false); });

  function applySize() {
    document.documentElement.style.setProperty("--fs", SIZES[S.fs] + "px");
    $("fs-out").textContent = (S.fs + 1) + " / " + SIZES.length;
  }
  function resize(d) {
    var f = fracNow();
    S.fs = Math.max(0, Math.min(SIZES.length - 1, S.fs + d));
    applySize(); save();
    if (!reader.hidden) relayout(f);
    measureSoon();                                  /* 글자 크기가 바뀌면 책 전체 쪽 수도 다시 센다 */
  }
  $("fs-down").addEventListener("click", function () { resize(-1); });
  $("fs-up").addEventListener("click", function () { resize(1); });

  document.querySelectorAll("[data-mode-pick]").forEach(function (b) {
    b.addEventListener("click", function () {
      var f = fracNow();
      S.mode = b.getAttribute("data-mode-pick");
      document.querySelectorAll("[data-mode-pick]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      reader.setAttribute("data-mode", S.mode);
      save();
      if (!reader.hidden) relayout(f);
    });
  });

  var rt = 0;
  window.addEventListener("resize", function () {
    measureSoon();                                  /* 화면 크기가 바뀌면 쪽 수도 바뀐다 */
    if (reader.hidden) return;
    var f = fracNow();
    clearTimeout(rt); rt = setTimeout(function () { relayout(f); }, 160);
  });

  var toastT = 0;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 1600); }

  /* 목차·단추 */
  document.querySelectorAll("#toc-list a").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var i = Number(a.getAttribute("data-ch"));
      openChapter(i, S.ch === i ? S.frac : 0);
    });
  });
  $("start").addEventListener("click", function () { openChapter(0, 0); });
  $("resume").addEventListener("click", function () { openChapter(S.ch, S.frac); });

  /* 글꼴이 늦게 도착하면 줄바꿈이 달라진다 → 다 오면 쪽을 다시 센다 */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { measureSoon(); if (!reader.hidden) relayout(fracNow()); });
  }

  /* 한글 글꼴은 글자 묶음별로 나중에 더 내려온다 → 내려올 때마다 쪽을 다시 센다 */
  if (document.fonts && document.fonts.addEventListener) {
    document.fonts.addEventListener("loadingdone", function () {
      measureSoon();
      if (reader.hidden) return;
      var f = fracNow();
      clearTimeout(rt); rt = setTimeout(function () { relayout(f); }, 120);
    });
  }
  /* 앱을 내리거나 탭을 바꿀 때 읽던 자리를 바로 저장 */
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") save(); });

  /* ───── 시작 ───── */
  function start(data) {
    applyTheme(); applySize();
    document.querySelectorAll("[data-mode-pick]").forEach(function (x) { x.setAttribute("aria-pressed", String(x.getAttribute("data-mode-pick") === S.mode)); });
    /* 지난번과 같은 화면·글자 크기면 그때 센 쪽 수를 바로 쓰고, 뒤에서 한 번 더 센다 */
    if (S.pgc && S.pgc.key === pgKey() && S.pgc.counts && S.pgc.counts.length === CH.length) {
      PG.key = S.pgc.key; setCounts(S.pgc.counts.slice());
    }
    save();                                          /* 읽는 방식 기본값(pv)을 바로 저장 */
    measureSoon();
    refreshHome();
    var m = /^#(prologue|ch(\d{1,2}))$/.exec(location.hash || "");
    if (data && data.view === "reader" && typeof data.ch === "number") openChapter(data.ch, data.frac || 0);
    else if (m) openChapter(m[1] === "prologue" ? 0 : Number(m[2]), 0);
  }
  /* 책을 새로 고쳐 올렸을 때 보고 있던 쪽을 그대로 이어 준다 */
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { view: reader.hidden ? "home" : "reader", ch: cur.ch, frac: fracNow() }; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
