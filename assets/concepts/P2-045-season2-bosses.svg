<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1520" width="1240" height="1520" font-family="sans-serif"><rect width="1240" height="1520" fill="#0F1729"/><text x="20" y="38" fill="#F3E7D3" font-size="22" font-weight="bold">시즌 2 보스 콘셉트 시트 — B-13~B-20 (8종)</text><text x="20" y="62" fill="#4FA8A0" font-size="12">도형 초안·실루엣 합격선 = 검정으로 칠해도 구별. 작품명 참조 없음.</text><rect x="20" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-13 줄의 맨 앞 노인</text><text x="388" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">기다림형 · 삼도천 나루</text><g transform="translate(212.0,375)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-34,0 L-26,-140 L26,-140 L34,0Z" fill="#14141C"/><ellipse cx="0" cy="-160" rx="20" ry="22" fill="#14141C"/><ellipse cx="-90" cy="-60" rx="12" ry="40" fill="#BFE8FF" opacity=".5"/><ellipse cx="-50" cy="-60" rx="12" ry="40" fill="#BFE8FF" opacity=".5"/><ellipse cx="30" cy="-60" rx="12" ry="40" fill="#BFE8FF" opacity=".5"/><ellipse cx="70" cy="-60" rx="12" ry="40" fill="#BFE8FF" opacity=".5"/></g><text x="36" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="438" fill="#F3E7D3" font-size="13">남을 먼저 태우다 백 년째 맨 앞에 서 있다</text><text x="36" y="464" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="482" fill="#F3E7D3" font-size="13">뒤에 선 혼 줄이 장판 방향을 알려 준다. </text><text x="36" y="500" fill="#F3E7D3" font-size="13">줄 혼을 건드리면 손해(제안)</text><rect x="420" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-14 돌아선 혼들의 덩어리</text><text x="788" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">덩어리형 · 삼도천 나루</text><g transform="translate(612.0,375)"><circle cx="-30" cy="-40" r="40" fill="#14141C"/><circle cx="30" cy="-36" r="38" fill="#14141C"/><circle cx="0" cy="-90" r="34" fill="#14141C"/><circle cx="0" cy="-10" r="36" fill="#14141C"/><circle cx="-60" cy="-6" r="22" fill="#14141C"/><circle cx="62" cy="-6" r="22" fill="#14141C"/><ellipse cx="0" cy="0" rx="100" ry="30" fill="none" stroke="#E85C41" stroke-width="4" stroke-dasharray="9 7"/></g><text x="436" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="438" fill="#F3E7D3" font-size="13">기다리다 돌아선 혼 수백이 엉겼다(천도 불가</text><text x="436" y="456" fill="#F3E7D3" font-size="13">)</text><text x="436" y="482" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="500" fill="#F3E7D3" font-size="13">붉은 점선 고리 안은 항상 위험. 파혼만 가</text><text x="436" y="518" fill="#F3E7D3" font-size="13">능</text><rect x="820" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="832" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="836" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-15 숫자를 처음 쓴 서리</text><text x="1188" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">기록형 · 저승 관아</text><g transform="translate(1012.0,375)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-30,0 L-22,-146 L22,-146 L30,0Z" fill="#14141C"/><path d="M-24,-150 L24,-150 L18,-172 L-18,-172Z" fill="#14141C"/><path d="M30,-110 L80,-170" stroke="#14141C" stroke-width="6"/><path d="M76,-176 L90,-200 L96,-172Z" fill="#14141C"/><text x="-70" y="-110" fill="#14141C" font-size="30">0 1 2</text></g><text x="836" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="836" y="438" fill="#F3E7D3" font-size="13">먹을 아끼려고 이름 대신 숫자를 상소했다</text><text x="836" y="464" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="836" y="482" fill="#F3E7D3" font-size="13">바닥 번호 칸 분류. 숫자 마당의 혼이 번호</text><text x="836" y="500" fill="#F3E7D3" font-size="13">순으로 줄 선다</text><rect x="20" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-16 벼루지기</text><text x="388" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">기록형 · 먹방</text><g transform="translate(212.0,845)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-40,0 L-34,-110 L34,-110 L40,0Z" fill="#14141C"/><ellipse cx="0" cy="-130" rx="20" ry="22" fill="#14141C"/><rect x="-100" y="-50" width="200" height="50" rx="8" fill="#14141C"/><ellipse cx="0" cy="-48" rx="80" ry="12" fill="#2A2A38" stroke="#C9B0FF" stroke-width="3"/></g><text x="36" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="908" fill="#F3E7D3" font-size="13">천도된 기억을 갈아 먹을 만들며 전부 봐야 </text><text x="36" y="926" fill="#F3E7D3" font-size="13">했다</text><text x="36" y="952" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="970" fill="#F3E7D3" font-size="13">벼루에서 먹물이 번진다. 기억색 보라 장판이</text><text x="36" y="988" fill="#F3E7D3" font-size="13"> 시야를 가린다</text><rect x="420" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-17 아홉째 문지기</text><text x="788" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">기다림형 · 명부전 담장</text><g transform="translate(612.0,845)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-44,0 L-36,-180 L36,-180 L44,0Z" fill="#14141C"/><path d="M-24,-190 L0,-214 L24,-190Z" fill="#14141C"/><rect x="64" y="-190" width="8" height="190" fill="#14141C"/><path d="M60,-190 L76,-210 L80,-190Z" fill="#14141C"/></g><text x="436" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="908" fill="#F3E7D3" font-size="13">문을 지키다 잠든 사이 인을 도둑맞았다</text><text x="436" y="934" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="952" fill="#F3E7D3" font-size="13">문이 열리는 박자에 맞춰 돌진을 피한다. 깃</text><text x="436" y="970" fill="#F3E7D3" font-size="13">대 휘두르기</text><rect x="820" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="832" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="836" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-18 인을 훔친 혼</text><text x="1188" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">기록형 · 인장 굴</text><g transform="translate(1012.0,845)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-30,0 L-22,-146 L22,-146 L30,0Z" fill="#14141C" stroke="#BFE8FF" stroke-width="2" stroke-dasharray="6 4"/><ellipse cx="0" cy="-166" rx="20" ry="22" fill="#14141C"/><rect x="-14" y="-196" width="28" height="12" fill="#E85C41"/><path d="M-30,-100 L-70,-60 M30,-100 L70,-60" stroke="#14141C" stroke-width="12"/></g><text x="836" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="836" y="908" fill="#F3E7D3" font-size="13">이름이 없어 자기 이마에 인을 찍으려 했다 </text><text x="836" y="926" fill="#F3E7D3" font-size="13">— 나와 같은 처지</text><text x="836" y="952" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="836" y="970" fill="#F3E7D3" font-size="13">붉은 인 자국 장판. 인장 벽의 이마 높이 </text><text x="836" y="988" fill="#F3E7D3" font-size="13">자국이 점등한다</text><rect x="20" y="1030" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="1082" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="1060" fill="#D4A94E" font-size="16" font-weight="bold">B-19 첫 차사</text><text x="388" y="1060" fill="#4FA8A0" font-size="12" text-anchor="end">차사형 · 우물터</text><g transform="translate(212.0,1315)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-30,0 L-20,-160 L20,-160 L30,0Z" fill="#14141C" stroke="#E85C41" stroke-width="3"/><ellipse cx="0" cy="-176" rx="30" ry="9" fill="#14141C"/><rect x="-10" y="-198" width="20" height="24" fill="#14141C"/><path d="M24,-110 Q70,-120 78,-60" stroke="#BFE8FF" stroke-width="3" fill="none"/><rect x="-6" y="-200" width="0" height="0"/></g><text x="36" y="1360" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="1378" fill="#F3E7D3" font-size="13">처음으로 혼을 깨뜨렸다. 그 이름을 기억하지</text><text x="36" y="1396" fill="#F3E7D3" font-size="13"> 못했다</text><text x="36" y="1422" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="1440" fill="#F3E7D3" font-size="13">플레이어 거울상 패턴. 철삭을 마주 휘두른다</text><rect x="420" y="1030" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="1082" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="1060" fill="#D4A94E" font-size="16" font-weight="bold">B-20 큰 물막이</text><text x="788" y="1060" fill="#4FA8A0" font-size="12" text-anchor="end">덩어리형 · 물막이 바닥</text><g transform="translate(612.0,1315)"><circle cx="-60" cy="-50" r="56" fill="#14141C"/><circle cx="60" cy="-50" r="56" fill="#14141C"/><circle cx="0" cy="-110" r="52" fill="#14141C"/><circle cx="0" cy="-20" r="50" fill="#14141C"/><circle cx="-110" cy="-10" r="32" fill="#14141C"/><circle cx="110" cy="-10" r="32" fill="#14141C"/><circle cx="-40" cy="-150" r="28" fill="#14141C"/><circle cx="40" cy="-150" r="28" fill="#14141C"/><ellipse cx="0" cy="8" rx="150" ry="40" fill="none" stroke="#C9B0FF" stroke-width="5"/><circle cx="-20" cy="-110" r="7" fill="#F3E7D3"/><circle cx="20" cy="-110" r="7" fill="#F3E7D3"/></g><text x="436" y="1360" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="1378" fill="#F3E7D3" font-size="13">모든 관할에서 깨진 이름이 흘러와 고인 덩어</text><text x="436" y="1396" fill="#F3E7D3" font-size="13">리</text><text x="436" y="1422" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="1440" fill="#F3E7D3" font-size="13">풀어내기 / 파혼으로 결말이 갈린다. 가장 </text><text x="436" y="1458" fill="#F3E7D3" font-size="13">큰 실루엣</text></svg>