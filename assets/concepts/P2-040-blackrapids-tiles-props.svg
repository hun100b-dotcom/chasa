<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1520" width="1260" height="1520" font-family="sans-serif"><rect width="1260" height="1520" fill="#0F1729"/><text x="24" y="38" fill="#F3E7D3" font-size="22" text-anchor="start" font-weight="bold">검은여울 읍성 타일·소품 실루엣 시트 (쿼터뷰 2:1, 도형 초안)</text><text x="24" y="60" fill="#4FA8A0" font-size="12" text-anchor="start">② 관할 4구역: 장터거리 · 동헌 터 · 역병막 · 무덤골. 타일 한 칸 = 128×64px. 검정으로 칠해도 읽히는지로 먼저 확정. 작품명 참조 없음.</text><text x="24" y="98" fill="#D4A94E" font-size="15" text-anchor="start" font-weight="bold">A. 바닥 타일 8종 (구역 색은 솔고개보다 차갑고 젖어 있다 — 성벽 안은 흙이 아니라 돌)</text><g transform="translate(110,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#3A4457" stroke="#0F1729" stroke-width="1"/><path d="M-40,-4 L-10,-18 M-8,6 L24,-8 M10,14 L40,0 M-24,12 L-6,4" stroke="#4FA8A0" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/></g><text x="110" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">젖은 돌길</text><text x="110" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">장터거리 · 비 온 뒤 번들, 물웅덩이 반사</text><g transform="translate(410,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#5B4D3E" stroke="#0F1729" stroke-width="1"/></g><text x="410" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">장터 흙</text><text x="410" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">좌판 사이 밟힌 흙</text><g transform="translate(710,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#4A4F5E" stroke="#0F1729" stroke-width="1"/><path d="M-32,-8 L0,-24 L32,-8 L0,8 Z M0,8 L0,24" fill="none" stroke="#0F1729" stroke-width="2"/></g><text x="710" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">동헌 박석</text><text x="710" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">관아 터 · 네모 석판이 가지런함</text><g transform="translate(1010,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#2F2D33" stroke="#0F1729" stroke-width="1"/><circle cx="-14" cy="-4" r="9" fill="#5A5A63" opacity=".5"/><circle cx="18" cy="6" r="7" fill="#5A5A63" opacity=".5"/></g><text x="1010" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">그을린 바닥</text><text x="1010" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">불탄 문서함 주변, 재가 흩어짐</text><g transform="translate(110,320)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#8A7B58" stroke="#0F1729" stroke-width="1"/><path d="M-44,0 L-12,-16 M-26,10 L12,-8 M0,18 L40,-2" stroke="#6B5E40" stroke-width="3"/><circle cx="-6" cy="2" r="10" fill="#C8C3A0" opacity=".35"/></g><text x="110" y="382" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">역병막 멍석</text><text x="110" y="400" fill="#4FA8A0" font-size="11" text-anchor="middle">짚 멍석. 석회 가루가 뿌려져 하얗다</text><g transform="translate(410,320)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#C8C3A0" stroke="#0F1729" stroke-width="1"/><path d="M-52,6 L52,-6" stroke="#0F1729" stroke-width="1" opacity=".4"/></g><text x="410" y="382" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">석회 선</text><text x="410" y="400" fill="#4FA8A0" font-size="11" text-anchor="middle">막 둘레에 그은 하얀 줄 = 들어가면 안 되는 선</text><g transform="translate(710,320)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#2F4535" stroke="#0F1729" stroke-width="1"/><path d="M-30,6 l4,-10 M-6,-6 l4,-10 M20,8 l4,-10 M30,-2 l3,-8" stroke="#5E7A4C" stroke-width="2"/></g><text x="710" y="382" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">무덤골 잔디</text><text x="710" y="400" fill="#4FA8A0" font-size="11" text-anchor="middle">이름 없는 봉분 사이 마른 풀</text><g transform="translate(1010,320)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#1D2C47" stroke="#0F1729" stroke-width="1"/><ellipse cx="0" cy="0" rx="34" ry="12" fill="none" stroke="#BFE8FF" stroke-opacity=".4"/></g><text x="1010" y="382" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">검은 물</text><text x="1010" y="400" fill="#4FA8A0" font-size="11" text-anchor="middle">여울 가장자리. 걸으면 느려지는 칸(제안)</text><text x="24" y="520" fill="#D4A94E" font-size="15" text-anchor="start" font-weight="bold">B. 소품 16종 (footprint = 차지하는 칸 수, 앵커 = 발 닿는 점)</text><rect x="10" y="548" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(150,680)" fill="#000"><path d="M-66,0 L-66,-78 L-48,-78 L-48,-92 L-30,-92 L-30,-78 L-12,-78 L-12,-92 L6,-92 L6,-78 L24,-78 L24,-92 L42,-92 L42,-78 L66,-78 L66,0 L0,30 Z"/></g><text x="150" y="738" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">성벽 조각  (2×1)</text><rect x="330" y="548" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(470,680)" fill="#000"><path d="M-76,-52 L0,-96 L76,-52 L58,-46 L58,-50 L-58,-50 L-58,-46 Z"/><path d="M-52,-40 L-46,0 M52,-40 L46,0 M-52,-40 L52,-40" stroke="#000" stroke-width="8" fill="none"/><rect x="-30" y="-30" width="60" height="14"/></g><text x="470" y="738" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">장터 좌판  (2×1)</text><rect x="650" y="548" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(790,680)" fill="#000"><rect x="-3" y="-90" width="6" height="90"/><rect x="-16" y="-110" width="32" height="26" rx="6"/><ellipse cx="0" cy="2" rx="18" ry="7"/></g><text x="790" y="738" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">등롱 장대  (1×1)</text><rect x="970" y="548" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(1110,680)" fill="#000"><path d="M-30,0 L-30,-60 L30,-60 L30,0 M-30,-40 L30,-40 M-22,0 L-22,-20 M22,0 L22,-20" stroke="#000" stroke-width="7" fill="none"/></g><text x="1110" y="738" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">곤장대  (1×1)</text><rect x="10" y="758" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(150,890)" fill="#000"><ellipse cx="0" cy="-10" rx="30" ry="14"/><rect x="-30" y="-10" width="60" height="22"/><path d="M-26,-12 L-26,-60 L26,-60 L26,-12" stroke="#000" stroke-width="6" fill="none"/></g><text x="150" y="948" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">우물  (1×1)</text><rect x="330" y="758" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(470,890)" fill="#000"><path d="M-50,0 L-50,-70 M-30,0 L-30,-70 M-10,0 L-10,-70 M10,0 L10,-70 M30,0 L30,-70 M50,0 L50,-70 M-56,-72 L56,-72" stroke="#000" stroke-width="7"/></g><text x="470" y="948" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">옥 창살  (2×1)</text><rect x="650" y="758" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(790,890)" fill="#000"><path d="M-30,0 L-30,-34 L0,-48 L30,-34 L30,0 L0,16 Z"/><path d="M-12,-50 L-4,-70 L6,-52" stroke="#000" stroke-width="3" fill="none"/></g><text x="790" y="948" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">불탄 문서함  (1×1)</text><rect x="970" y="758" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(1110,890)" fill="#000"><rect x="-48" y="-96" width="96" height="96"/><path d="M-48,-64 L48,-64 M-48,-32 L48,-32 M-16,-96 L-16,0 M16,-96 L16,0" stroke="#fff" stroke-opacity=".25" stroke-width="2"/><rect x="-14" y="-22" width="28" height="18" fill="none" stroke="#5FE3C0" stroke-width="3"/></g><text x="1110" y="948" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">약장 (보스방)  (2×1)</text><rect x="10" y="968" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(150,1100)" fill="#000"><path d="M-76,-30 Q0,-130 76,-30 L60,-22 L60,0 L-60,0 L-60,-22 Z"/><path d="M-12,0 L-12,-30 L12,-30 L12,0 Z" fill="#DDD3BF"/></g><text x="150" y="1158" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">역병막 움막  (2×2)</text><rect x="330" y="968" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(470,1100)" fill="#000"><path d="M-36,0 L0,-14 L36,0 L0,14 Z"/><ellipse cx="0" cy="-16" rx="10" ry="14"/></g><text x="470" y="1158" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">멍석 환자(혼 자리)  (1×1)</text><rect x="650" y="968" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(790,1100)" fill="#000"><path d="M-18,0 L-14,-26 L14,-26 L18,0 Z"/><ellipse cx="0" cy="-30" rx="22" ry="8"/><path d="M-6,-40 q6,-18 12,0" stroke="#000" stroke-width="4" fill="none"/></g><text x="790" y="1158" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">약탕 화로  (1×1)</text><rect x="970" y="968" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(1110,1100)" fill="#000"><path d="M-22,0 Q-30,-30 -12,-46 L12,-46 Q30,-30 22,0 Z"/></g><text x="1110" y="1158" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">석회 가마니  (1×1)</text><rect x="10" y="1178" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(150,1310)" fill="#000"><path d="M-70,0 Q-60,-66 0,-70 Q60,-66 70,0 L0,34 Z"/></g><text x="150" y="1368" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">이름 없는 봉분  (2×2)</text><rect x="330" y="1178" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(470,1310)" fill="#000"><rect x="-18" y="-76" width="36" height="76" rx="14"/><rect x="-30" y="-8" width="60" height="12"/></g><text x="470" y="1368" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">빈 비석 받침  (1×1)</text><rect x="650" y="1178" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(790,1310)" fill="#000"><rect x="-3" y="-60" width="6" height="60"/><rect x="-22" y="-82" width="44" height="30"/></g><text x="790" y="1368" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">번호 팻말  (1×1)</text><rect x="970" y="1178" width="280" height="170" rx="10" fill="#F3E7D3" opacity=".9"/><g transform="translate(1110,1310)" fill="#000"><path d="M-26,0 L-26,-30 L0,-44 L26,-30 L26,0 L0,14 Z"/></g><text x="1110" y="1368" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">분류 상자 (보스방)  (1×1)</text><text x="24" y="1505" fill="#4FA8A0" font-size="12" text-anchor="start">※ 검정 실루엣만으로 구별되는지가 합격선. 구역 전용 제안색(석회 #C8C3A0 · 젖은 돌 #3A4457 · 재 #5A5A63)은 오너 승인 전 palette-tokens.json 에 넣지 않는다.</text></svg>