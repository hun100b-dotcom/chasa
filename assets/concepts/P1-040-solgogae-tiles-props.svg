<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1250" width="1260" height="1250" font-family="sans-serif"><rect width="1260" height="1250" fill="#0F1729"/><text x="24" y="38" fill="#F3E7D3" font-size="22" font-weight="bold">솔고개 마을 타일·소품 실루엣 시트 (쿼터뷰 2:1, 도형 초안)</text><text x="24" y="60" fill="#4FA8A0" font-size="12">타일 한 칸 = 128×64px(2:1 마름모). 소품은 차지하는 칸 수(footprint)와 "검정으로 칠해도 무엇인지 읽히는가"로 먼저 확정한다. 작품명 참조 없음.</text><text x="24" y="98" fill="#D4A94E" font-size="15" font-weight="bold">A. 바닥 타일 6종</text><g transform="translate(110,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#8C6F4E" stroke="#0F1729" stroke-width="1"/><path d="M-38,4 L-10,-10 M10,12 L40,-2 M-6,18 L14,8" stroke="#7A5E3F" stroke-width="4" stroke-linecap="round"/></g><text x="110" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">흙길</text><text x="110" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">밤에 가장 밝은 길 = 이동 동선</text><g transform="translate(310,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#6D5A44" stroke="#0F1729" stroke-width="1"/><path d="M-38,4 L-10,-10 M10,12 L40,-2 M-6,18 L14,8" stroke="#5E4C38" stroke-width="4" stroke-linecap="round"/></g><text x="310" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">마당 흙</text><text x="310" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">집 앞, 소품이 서는 곳</text><g transform="translate(510,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#3E5A44" stroke="#0F1729" stroke-width="1"/><path d="M-38,4 L-10,-10 M10,12 L40,-2 M-6,18 L14,8" stroke="#34503B" stroke-width="4" stroke-linecap="round"/></g><text x="510" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">풀밭</text><text x="510" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">마을 가장자리</text><g transform="translate(710,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#4F6B49" stroke="#0F1729" stroke-width="1"/><path d="M-38,4 L-10,-10 M10,12 L40,-2 M-6,18 L14,8" stroke="#5B8AA0" stroke-width="4" stroke-linecap="round"/></g><text x="710" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">논두렁</text><text x="710" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">보릿들 · 물 고인 논</text><g transform="translate(910,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#7C808A" stroke="#0F1729" stroke-width="1"/><path d="M-38,4 L-10,-10 M10,12 L40,-2 M-6,18 L14,8" stroke="#6A6E78" stroke-width="4" stroke-linecap="round"/></g><text x="910" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">돌길</text><text x="910" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">서낭당 고개 · 안전지대</text><g transform="translate(1110,170)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="#5B8AA0" stroke="#0F1729" stroke-width="1"/><path d="M-38,4 L-10,-10 M10,12 L40,-2 M-6,18 L14,8" stroke="#9A9EA8" stroke-width="4" stroke-linecap="round"/></g><text x="1110" y="232" fill="#F3E7D3" font-size="14" text-anchor="middle" font-weight="bold">징검다리</text><text x="1110" y="250" fill="#4FA8A0" font-size="11" text-anchor="middle">물막이 골 · 무너진 징검다리</text><text x="24" y="292" fill="#D4A94E" font-size="15" font-weight="bold">B. 소품 12종 (왼쪽 컬러 · 오른쪽 위 작은 그림 = 검정 칠 가독성 테스트)</text><rect x="15" y="310" width="290" height="270" rx="8" fill="#16213E" stroke="#2C3A60"/><g transform="translate(160,525) scale(.8)"><path d="M0,-64 L128,0 L0,64 L-128,0 Z" fill="none" stroke="#3B4C7A" stroke-dasharray="5 4"/><path d="M-62,-6 L0,22 L62,-6 L62,-44 L0,-16 L-62,-44 Z" fill="#8A7A63"/><path d="M-78,-40 Q-70,-78 0,-92 Q70,-78 78,-40 L0,-4 Z" fill="#C9A25A"/><path d="M-78,-40 L0,-4 L78,-40" stroke="#7A5E2C" stroke-width="3" fill="none"/><rect x="-10" y="-30" width="20" height="26" rx="2" fill="#3A2A1E"/></g><g transform="translate(260,405) scale(.4)"><path d="M-62,-6 L0,22 L62,-6 L62,-44 L0,-16 L-62,-44 Z" fill="#000"/><path d="M-78,-40 Q-70,-78 0,-92 Q70,-78 78,-40 L0,-4 Z" fill="#000"/><path d="M-78,-40 L0,-4 L78,-40" stroke="#000" stroke-width="3