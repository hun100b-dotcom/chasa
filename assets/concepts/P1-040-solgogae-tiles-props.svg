48 L96,0 L0,48 L-96,0 Z" fill="none" stroke="#3B4C7A" stroke-dasharray="5 4"/><rect x="-52" y="-30" width="104" height="9" fill="#B58B54"/><rect x="-48" y="-21" width="6" height="21" fill="#6B4A2E"/><rect x="42" y="-21" width="6" height="21" fill="#6B4A2E"/></g><g transform="translate(560,985) scale(.4)"><rect x="-52" y="-30" width="104" height="9" fill="#000"/><rect x="-48" y="-21" width="6" height="21" fill="#000"/><rect x="42" y="-21" width="6" height="21" fill="#000"/></g><text x="328" y="1146" fill="#F3E7D3" font-size="14" font-weight="bold">평상</text><text x="592" y="1146" fill="#4FA8A0" font-size="12" text-anchor="end">차지하는 칸 2×1</text><rect x="615" y="890" width="290" height="270" rx="8" fill="#16213E" stroke="#2C3A60"/><g transform="translate(760,1105) scale(.8)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="none" stroke="#3B4C7A" stroke-dasharray="5 4"/><path d="M-18,0 L-12,-70 M18,0 L12,-70" stroke="#6B4A2E" stroke-width="7"/><path d="M-14,-24 L14,-24 M-13,-46 L13,-46" stroke="#6B4A2E" stroke-width="5"/><path d="M-22,-70 Q-14,-90 -10,-80 M22,-70 Q14,-90 10,-80" stroke="#6B4A2E" stroke-width="5" fill="none"/></g><g transform="translate(860,985) scale(.4)"><path d="M-18,0 L-12,-70 M18,0 L12,-70" stroke="#000" stroke-width="7"/><path d="M-14,-24 L14,-24 M-13,-46 L13,-46" stroke="#000" stroke-width="5"/><path d="M-22,-70 Q-14,-90 -10,-80 M22,-70 Q14,-90 10,-80" stroke="#000" stroke-width="5" fill="none"/></g><text x="628" y="1146" fill="#F3E7D3" font-size="14" font-weight="bold">지게</text><text x="892" y="1146" fill="#4FA8A0" font-size="12" text-anchor="end">차지하는 칸 1×1</text><rect x="915" y="890" width="290" height="270" rx="8" fill="#16213E" stroke="#2C3A60"/><g transform="translate(1060,1105) scale(.8)"><path d="M0,-32 L64,0 L0,32 L-64,0 Z" fill="none" stroke="#3B4C7A" stroke-dasharray="5 4"/><rect x="-3" y="-110" width="6" height="110" fill="#6B4A2E"/><path d="M-14,-108 L10,-108 L22,-120 L8,-116 L-2,-124 L-6,-114 Z" fill="#4FA8A0"/></g><g transform="translate(1160,985) scale(.4)"><rect x="-3" y="-110" width="6" height="110" fill="#000"/><path d="M-14,-108 L10,-108 L22,-120 L8,-116 L-2,-124 L-6,-114 Z" fill="#000"/></g><text x="928" y="1146" fill="#F3E7D3" font-size="14" font-weight="bold">솟대</text><text x="1192" y="1146" fill="#4FA8A0" font-size="12" text-anchor="end">차지하는 칸 1×1</text><text x="24" y="1186" fill="#F3E7D3" font-size="12">읽는 법: 서낭나무의 오방색 천(청·황·적·백·흑)과 상여의 붉은 띠는 이 마을의 "신호색"이다. 나머지는 낮은 채도로 눌러서 혼불 청록(#5FE3C0)과 맺힘 붉은색(#E85C41)이 화면에서 먼저 보이게 한다.</text><text x="24" y="1210" fill="#4FA8A0" font-size="12">상여 = 서사 핵심 소품(상여가 너무 자주 나간다). 서낭나무 아래 돌무더기 = 천도 보상 연출(돌이 하나 늘어난다). 넘기는 값: 타일 128×64, 소품 기준점 = 땅에 닿는 중심.</text></svg>