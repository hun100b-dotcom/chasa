<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="sans-serif">
  <!-- P1-033 적 4종 콘셉트. 떠돈 기간이 생김새로 보인다 = 처결 대기 시간을 눈으로 예측 (ART-DIRECTION §4) -->
  <defs>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="900" height="560" fill="#16213E"/>
  <rect y="470" width="900" height="90" fill="#0F1729"/>
  <text x="30" y="40" fill="#F3E7D3" font-size="22" font-weight="bold">P1-033 혼 4종 콘셉트 (초안)</text>
  <text x="30" y="64" fill="#4FA8A0" font-size="13">왼쪽 → 오른쪽: 오래 떠돌수록 윤곽이 무너진다. 대기 시간 막대 색(config SOUL_COLOR)과 같은 순서.</text>

  <!-- 1 갓 죽은 혼: 선명한 사람 형태, 생전 옷차림, 표정 -->
  <g transform="translate(120,0)">
    <path d="M-36,200 L36,200 L52,400 L-52,400 Z" fill="#F3E7D3" opacity="0.92"/>
    <circle cx="0" cy="170" r="26" fill="#F3E7D3"/>
    <circle cx="-9" cy="167" r="3" fill="#16213E"/><circle cx="9" cy="167" r="3" fill="#16213E"/>
    <path d="M-8,181 Q0,187 8,181" stroke="#16213E" fill="none" stroke-width="2"/>
    <path d="M-36,200 L-62,300" stroke="#F3E7D3" stroke-width="12" stroke-linecap="round"/>
    <path d="M36,200 L62,300" stroke="#F3E7D3" stroke-width="12" stroke-linecap="round"/>
    <rect x="-52" y="300" width="104" height="8" fill="#4FA8A0"/>
    <text x="0" y="440" fill="#BFE8FF" font-size="15" text-anchor="middle" font-weight="bold">갓 죽은 혼 · 10초</text>
    <text x="0" y="460" fill="#F3E7D3" font-size="11" text-anchor="middle">사람 형태 · 옷 · 표정</text>
  </g>

  <!-- 2 해 넘긴 혼: 윤곽 번짐, 옷이 물에 번진 듯 -->
  <g transform="translate(340,0)">
    <g filter="url(#blur2)">
      <path d="M-40,200 L40,200 L62,410 L-62,410 Z" fill="#E8C86A" opacity="0.8"/>
      <circle cx="0" cy="170" r="27" fill="#E8C86A" opacity="0.85"/>
      <path d="M-40,200 L-72,310" stroke="#E8C86A" stroke-width="13" stroke-linecap="round" opacity="0.7"/>
      <path d="M40,200 L72,310" stroke="#E8C86A" stroke-width="13" stroke-linecap="round" opacity="0.7"/>
    </g>
    <path d="M-62,410 q-6,20 0,34 M-20,410 q-4,26 2,40 M30,410 q6,24 0,36" stroke="#E8C86A" stroke-width="5" fill="none" opacity="0.5"/>
    <circle cx="-9" cy="168" r="3" fill="#16213E" opacity="0.5"/><circle cx="9" cy="168" r="3" fill="#16213E" opacity="0.5"/>
    <text x="0" y="440" fill="#FFCC55" font-size="15" text-anchor="middle" font-weight="bold">해 넘긴 혼 · 7초</text>
    <text x="0" y="460" fill="#F3E7D3" font-size="11" text-anchor="middle">윤곽이 번지기 시작 · 아래가 흐름</text>
  </g>

  <!-- 3 오래된 혼: 형태 붕괴, 비율 무너짐, 얼굴 없음 -->
  <g transform="translate(560,0)">
    <path d="M-20,190 Q-54,260 -30,330 Q-40,400 -8,410 Q20,380 42,410 Q58,330 30,270 Q36,220 20,190 Z" fill="#E8683A" opacity="0.85" filter="url(#blur2)"/>
    <ellipse cx="2" cy="172" rx="22" ry="34" fill="#E8683A" opacity="0.9"/>
    <path d="M-30,230 Q-110,300 -96,400" stroke="#E8683A" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M30,240 Q66,340 58,380 M-6,300 Q10,360 -2,420" stroke="#E8683A" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
    <text x="0" y="440" fill="#FF6A3D" font-size="15" text-anchor="middle" font-weight="bold">오래된 혼 · 4초</text>
    <text x="0" y="460" fill="#F3E7D3" font-size="11" text-anchor="middle">팔다리 비율 붕괴 · 얼굴 없음</text>
  </g>

  <!-- 4 덩어리: 여러 혼이 뭉쳐 개별 형태 소실, 구할 수 없음 -->
  <g transform="translate(780,0)">
    <g filter="url(#blur2)" fill="#7B4FD6" opacity="0.9">
      <circle cx="-14" cy="300" r="52"/><circle cx="22" cy="260" r="44"/><circle cx="-26" cy="236" r="36"/><circle cx="30" cy="330" r="40"/>
    </g>
    <!-- 뭉친 속에서 비어져 나온 손·얼굴 조각 = '이미 여럿이 엉켰다' -->
    <path d="M-52,280 l-16,-16 m16,16 l-22,2 m22,-2 l-10,-24" stroke="#C9B0FF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="14" cy="268" r="7" fill="#16213E" opacity="0.6"/><circle cx="-12" cy="318" r="6" fill="#16213E" opacity="0.6"/>
    <!-- 닫힌 사슬 표시 = 천도 불가 -->
    <circle cx="0" cy="285" r="78" fill="none" stroke="#E85C41" stroke-width="3" stroke-dasharray="4 10" opacity="0.8"/>
    <text x="0" y="440" fill="#9A5CFF" font-size="15" text-anchor="middle" font-weight="bold">덩어리 · 천도 불가</text>
    <text x="0" y="460" fill="#F3E7D3" font-size="11" text-anchor="middle">개별 형태 소실 · 구할 수 없음(파혼만)</text>
  </g>

  <text x="30" y="515" fill="#F3E7D3" font-size="12">읽는 법: 윤곽이 또렷하면 시간이 많고, 흐릴수록 급하다. 덩어리는 붉은 점선 고리로 "천도 불가"를 색(차사의 붉은색)으로 알린다.</text>
  <text x="30" y="536" fill="#4FA8A0" font-size="11">주의: 도형 기반 콘셉트. 최종 에셋은 엔진 확정(P1-001) + Higgsfield 파이프라인(P1-032) 이후. 작품명 참조 없음.</text>
</svg>
