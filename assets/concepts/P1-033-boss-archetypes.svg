<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1862 640" width="1862" height="640" font-family="sans-serif"><rect width="100%" height="100%" fill="#0F1729"/><text x="14" y="36" fill="#F3E7D3" font-size="22" font-weight="bold">P1-033 시즌1 보스 원형 7종 콘셉트 (31종 중 재사용 뼈대, 도형 초안)</text><text x="14" y="58" fill="#4FA8A0" font-size="12">원형 = 패턴 뼈대와 실루엣 언어. 개별 보스는 겉모습·한·낮 단서만 갈아 끼운다. 작품명 참조 없음.</text><g transform="translate(14,72)"><rect width="250" height="560" rx="8" fill="#16213E" stroke="#4FA8A0"/><text x="14" y="30" fill="#4FA8A0" font-size="20" font-weight="bold">① 물 위</text><text x="14" y="50" fill="#F3E7D3" font-size="12">배·나루 위에서 도는 보스</text><g transform="translate(0,60)"><path d="M30 150 Q125 200 220 150 L205 175 Q125 215 45 175 Z" fill="#2A2A38" stroke="#4FA8A0" stroke-width="2"/><line x1="170" y1="40" x2="125" y2="170" stroke="#F3E7D3" stroke-width="3"/><g transform="translate(125,70) scale(1.1)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#2A2A38" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#2A2A38" stroke="#F3E7D3"/></g><path d="M20 215 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M20 229 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M20 243 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M80 215 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M80 229 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M80 243 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M140 215 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M140 229 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M140 243 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M200 215 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M200 229 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/><path d="M200 243 q15 -8 30 0 t30 0" stroke="#4FA8A0" fill="none" opacity=".7"/></g><text x="14" y="380" fill="#4FA8A0" font-size="11">발밑이 곧 전장: 바닥 반경이 좁아진다</text><text x="14" y="410" fill="#F3E7D3" font-size="11">B-01 나루 영감</text><text x="14" y="426" fill="#F3E7D3" font-size="11">B-10 만선호 선장</text><text x="14" y="442" fill="#F3E7D3" font-size="11">B-21 마지막 손님</text><text x="14" y="458" fill="#F3E7D3" font-size="11">B-30 첫 우물(물+사공)</text></g><g transform="translate(278,72)"><rect width="250" height="560" rx="8" fill="#16213E" stroke="#D4A94E"/><text x="14" y="30" fill="#D4A94E" font-size="20" font-weight="bold">② 의식</text><text x="14" y="50" fill="#F3E7D3" font-size="12">굿·제사를 올리는 보스</text><g transform="translate(0,60)"><ellipse cx="125" cy="190" rx="95" ry="30" fill="none" stroke="#D4A94E" stroke-width="2" stroke-dasharray="6 4"/><g transform="translate(125,80) scale(1.1)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/></g><path d="M50 40 q6 40 0 90" stroke="#E85C41" stroke-width="5" fill="none"/><path d="M88 40 q6 40 0 90" stroke="#E85C41" stroke-width="5" fill="none"/><path d="M126 40 q6 40 0 90" stroke="#E85C41" stroke-width="5" fill="none"/><path d="M164 40 q6 40 0 90" stroke="#E85C41" stroke-width="5" fill="none"/><path d="M202 40 q6 40 0 90" stroke="#E85C41" stroke-width="5" fill="none"/><circle cx="125" cy="190" r="6" fill="#D4A94E"/></g><text x="14" y="380" fill="#4FA8A0" font-size="11">원형 무대 + 도는 장판, 방울·천 조각</text><text x="14" y="410" fill="#F3E7D3" font-size="11">B-02 월화</text><text x="14" y="426" fill="#F3E7D3" font-size="11">B-16 벼루지기</text></g><g transform="translate(542,72)"><rect width="250" height="560" rx="8" fill="#16213E" stroke="#E85C41"/><text x="14" y="30" fill="#E85C41" font-size="20" font-weight="bold">③ 기록</text><text x="14" y="50" fill="#F3E7D3" font-size="12">명단·장부·인장을 쥔 보스</text><g transform="translate(0,60)"><rect x="25" y="150" width="65" height="28" fill="none" stroke="#F3E7D3" opacity=".6"/><rect x="25" y="184" width="65" height="28" fill="none" stroke="#F3E7D3" opacity=".6"/><rect x="100" y="150" width="65" height="28" fill="none" stroke="#F3E7D3" opacity=".6"/><rect x="100" y="184" width="65" height="28" fill="none" stroke="#F3E7D3" opacity=".6"/><rect x="175" y="150" width="65" height="28" fill="none" stroke="#F3E7D3" opacity=".6"/><rect x="175" y="184" width="65" height="28" fill="none" stroke="#F3E7D3" opacity=".6"/><g transform="translate(125,70) scale(1.1)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#2A2A38" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#2A2A38" stroke="#F3E7D3"/></g><rect x="150" y="60" width="22" height="30" fill="#E85C41"/><rect x="156" y="90" width="10" height="26" fill="#D4A94E"/></g><text x="14" y="380" fill="#4FA8A0" font-size="11">바닥이 번호 칸으로 나뉘고 인장이 내리찍힌다</text><text x="14" y="410" fill="#F3E7D3" font-size="11">B-03 서 의원</text><text x="14" y="426" fill="#F3E7D3" font-size="11">B-08 장부꾼 염씨</text><text x="14" y="442" fill="#F3E7D3" font-size="11">B-15 서리</text><text x="14" y="458" fill="#F3E7D3" font-size="11">B-18 인을 훔친 혼</text><text x="14" y="474" fill="#F3E7D3" font-size="11">B-27 마지막 줄</text><text x="14" y="490" fill="#F3E7D3" font-size="11">B-28 벼루 밑의 손</text></g><g transform="translate(806,72)"><rect width="250" height="560" rx="8" fill="#16213E" stroke="#4FA8A0"/><text x="14" y="30" fill="#4FA8A0" font-size="20" font-weight="bold">④ 무리</text><text x="14" y="50" fill="#F3E7D3" font-size="12">부하를 부르는 우두머리</text><g transform="translate(0,60)"><g transform="translate(40,170) scale(0.55)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#3A3A52" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#3A3A52" stroke="#F3E7D3"/></g><g transform="translate(82,156) scale(0.55)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#3A3A52" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#3A3A52" stroke="#F3E7D3"/></g><g transform="translate(124,170) scale(0.55)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#3A3A52" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#3A3A52" stroke="#F3E7D3"/></g><g transform="translate(166,156) scale(0.55)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#3A3A52" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#3A3A52" stroke="#F3E7D3"/></g><g transform="translate(208,170) scale(0.55)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#3A3A52" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#3A3A52" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#3A3A52" stroke="#F3E7D3"/></g><g transform="translate(125,60) scale(1.4)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#2A2A38" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#2A2A38" stroke="#F3E7D3"/></g></g><text x="14" y="380" fill="#4FA8A0" font-size="11">보스 1 + 반복 소환, 군중 속 위치 읽기</text><text x="14" y="410" fill="#F3E7D3" font-size="11">B-05 기수 대돌</text><text x="14" y="426" fill="#F3E7D3" font-size="11">B-06 이름 없는 장수</text><text x="14" y="442" fill="#F3E7D3" font-size="11">B-07 반장 칠성</text><text x="14" y="458" fill="#F3E7D3" font-size="11">B-11 다리 밑 왕초</text><text x="14" y="474" fill="#F3E7D3" font-size="11">B-22 묶인 일곱(원진)</text><text x="14" y="490" fill="#F3E7D3" font-size="11">B-24 두 진</text><text x="14" y="506" fill="#F3E7D3" font-size="11">B-25 맨 마지막 몸</text></g><g transform="translate(1070,72)"><rect width="250" height="560" rx="8" fill="#16213E" stroke="#BFE8FF"/><text x="14" y="30" fill="#BFE8FF" font-size="20" font-weight="bold">⑤ 기다림</text><text x="14" y="50" fill="#F3E7D3" font-size="12">서서 기다리는 보스</text><g transform="translate(0,60)"><path d="M95 220 L100 90 Q125 60 150 90 L155 220 Z" fill="#2A2A38" stroke="#F3E7D3" stroke-width="2"/><circle cx="35" cy="240" r="7" fill="#BFE8FF" opacity="1.0"/><circle cx="65" cy="240" r="7" fill="#BFE8FF" opacity="0.9"/><circle cx="95" cy="240" r="7" fill="#BFE8FF" opacity="0.8"/><circle cx="125" cy="240" r="7" fill="#BFE8FF" opacity="0.7"/><circle cx="155" cy="240" r="7" fill="#BFE8FF" opacity="0.6"/><circle cx="185" cy="240" r="7" fill="#BFE8FF" opacity="0.5"/><circle cx="215" cy="240" r="7" fill="#BFE8FF" opacity="0.3999999999999999"/></g><text x="14" y="380" fill="#4FA8A0" font-size="11">거의 움직이지 않음, 줄/밀림 장판이 공격</text><text x="14" y="410" fill="#F3E7D3" font-size="11">B-09 망부석 아낙</text><text x="14" y="426" fill="#F3E7D3" font-size="11">B-13 줄의 맨 앞 노인</text><text x="14" y="442" fill="#F3E7D3" font-size="11">B-17 아홉째 문지기</text><text x="14" y="458" fill="#F3E7D3" font-size="11">B-29 사잣밥 할미</text></g><g transform="translate(1334,72)"><rect width="250" height="560" rx="8" fill="#16213E" stroke="#E85C41"/><text x="14" y="30" fill="#E85C41" font-size="20" font-weight="bold">⑥ 차사</text><text x="14" y="50" fill="#F3E7D3" font-size="12">같은 길을 걸은 차사</text><g transform="translate(0,60)"><g transform="translate(85,80) scale(1.2)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#2A2A38" stroke="#F3E7D3" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#2A2A38" stroke="#F3E7D3"/><rect x="-6" y="-30" width="12" height="13" fill="#2A2A38" stroke="#F3E7D3"/></g><g transform="translate(165,80) scale(1.2)"><path d="M-18 70 L-10 0 L10 0 L18 70 Z" fill="#1A1A26" stroke="#E85C41" stroke-width="1.5"/><circle cx="0" cy="-10" r="9" fill="#1A1A26" stroke="#E85C41" stroke-width="1.5"/><ellipse cx="0" cy="-17" rx="16" ry="3" fill="#1A1A26" stroke="#E85C41"/><rect x="-6" y="-30" width="12" height="13" fill="#1A1A26" stroke="#E85C41"/></g><path d="M105 150 Q125 190 145 150" stroke="#4FA8A0" stroke-width="3" fill="none" stroke-dasharray="5 3"/></g><text x="14" y="380" fill="#4FA8A0" font-size="11">플레이어 실루엣의 거울상, 사슬 대결</text><text x="14" y="410" fill="#F3E7D3" font-size="11">B-04 흑월 1차</text><text x="14" y="426" fill="#F3E7D3" font-size="11">B-12 흑월 2차</text><text x="14" y="442" fill="#F3E7D3" font-size="11">B-19 첫 차사</text><text x="14" y="458" fill="#F3E7D3" font-size="11">B-31 나의 백</text></g><g transform="translate(1598,72)"><rect width="250" height="560" rx="8" fill="#16213E" stroke="#9A5CFF"/><text x="14" y="30" fill="#9A5CFF" font-size="20" font-weight="bold">⑦ 덩어리</text><text x="14" y="50" fill="#F3E7D3" font-size="12">뭉친 혼의 산</text><g transform="translate(0,60)"><circle cx="100" cy="140" r="50" fill="#9A5CFF" opacity=".55" stroke="#F3E7D3" stroke-width="1"/><circle cx="150" cy="130" r="45" fill="#9A5CFF" opacity=".55" stroke="#F3E7D3" stroke-width="1"/><circle cx="125" cy="100" r="38" fill="#9A5CFF" opacity=".55" stroke="#F3E7D3" stroke-width="1"/><circle cx="125" cy="175" r="40" fill="#9A5CFF" opacity=".55" stroke="#F3E7D3" stroke-width="1"/><circle cx="85" cy="185" r="28" fill="#9A5CFF" opacity=".55" stroke="#F3E7D3" stroke-width="1"/><circle cx="170" cy="180" r="26" fill="#9A5CFF" opacity=".55" stroke="#F3E7D3" stroke-width="1"/><circle cx="112" cy="125" r="4" fill="#F3E7D3"/><circle cx="138" cy="118" r="4" fill="#F3E7D3"/><path d="M60 150 l-14 -18 m14 18 l-18 -4" stroke="#F3E7D3" stroke-width="2"/></g><text x="14" y="380" fill="#4FA8A0" font-size="11">선택 없음(파혼만) 구간 다수, 조각을 떼어 던짐</text><text x="14" y="410" fill="#F3E7D3" font-size="11">B-14 돌아선 혼들의 덩어리</text><text x="14" y="426" fill="#F3E7D3" font-size="11">B-20 큰 물막이</text><text x="14" y="442" fill="#F3E7D3" font-size="11">B-23 물 밑 매듭</text><text x="14" y="458" fill="#F3E7D3" font-size="11">B-26 두 겹 구덩이</text></g></svg>