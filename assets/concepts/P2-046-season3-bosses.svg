<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1990" width="1240" height="1990" font-family="sans-serif"><rect width="1240" height="1990" fill="#0F1729"/><text x="20" y="38" fill="#F3E7D3" font-size="22" font-weight="bold">시즌 3 보스(백) 콘셉트 시트 — B-21~B-31 (11종)</text><text x="20" y="62" fill="#4FA8A0" font-size="12">시즌 3는 혼이 아니라 몸이라 반짝임 없이 두꺼운 흙·물 윤곽. 도형 초안·실루엣 합격선 = 검정으로 칠해도 구별. 작품명 참조 없음.</text><rect x="20" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-21 윤 영감의 백</text><text x="388" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">물형 · 소 밑</text><g transform="translate(212.0,375)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-90,-10 Q0,-70 90,-10 L70,16 L-70,16Z" fill="#14141C"/><path d="M-20,-50 L-14,-130 L14,-130 L22,-50Z" fill="#14141C"/><ellipse cx="0" cy="-146" rx="18" ry="20" fill="#14141C"/><path d="M-100,-40 Q-60,-80 -20,-60" stroke="#BFE8FF" stroke-width="3" fill="none" opacity=".6"/></g><text x="36" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="438" fill="#F3E7D3" font-size="13">마지막 손님을 못 건넨 몸, 뒤집힌 배 밑에</text><text x="36" y="456" fill="#F3E7D3" font-size="13"> 박힘</text><text x="36" y="482" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="500" fill="#F3E7D3" font-size="13">산 사람이 이름을 부르면 눕는다(F51). </text><text x="36" y="518" fill="#F3E7D3" font-size="13">소의 물살 장판</text><rect x="420" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-22 줄에 묶인 일곱</text><text x="788" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">무리형 · 곶 밑 바다굴</text><g transform="translate(612.0,375)"><path d="M-112,0 L-108,-110 L-92,-110 L-88,0Z" fill="#14141C"/><ellipse cx="-100" cy="-124" rx="12" ry="14" fill="#14141C"/><path d="M-78,0 L-74,-110 L-58,-110 L-54,0Z" fill="#14141C"/><ellipse cx="-66" cy="-124" rx="12" ry="14" fill="#14141C"/><path d="M-45,0 L-41,-110 L-25,-110 L-21,0Z" fill="#14141C"/><ellipse cx="-33" cy="-124" rx="12" ry="14" fill="#14141C"/><path d="M-12,0 L-8,-110 L8,-110 L12,0Z" fill="#14141C"/><ellipse cx="0" cy="-124" rx="12" ry="14" fill="#14141C"/><path d="M21,0 L25,-110 L41,-110 L45,0Z" fill="#14141C"/><ellipse cx="33" cy="-124" rx="12" ry="14" fill="#14141C"/><path d="M54,0 L58,-110 L74,-110 L78,0Z" fill="#14141C"/><ellipse cx="66" cy="-124" rx="12" ry="14" fill="#14141C"/><path d="M88,0 L92,-110 L108,-110 L112,0Z" fill="#14141C"/><ellipse cx="100" cy="-124" rx="12" ry="14" fill="#14141C"/><path d="M-120,-70 Q0,-40 120,-70" stroke="#D4A94E" stroke-width="5" fill="none"/></g><text x="436" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="438" fill="#F3E7D3" font-size="13">만선호 선원 일곱의 몸이 한 줄에 묶여 있다</text><text x="436" y="464" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="482" fill="#F3E7D3" font-size="13">썰물에만 열림. 바다가 돌려준 물건 하나를 </text><text x="436" y="500" fill="#F3E7D3" font-size="13">묻으면 눕는다(F53)</text><rect x="820" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="832" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="836" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-23 물 밑 매듭</text><text x="1188" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">덩어리형 · 닻 여울</text><g transform="translate(1012.0,375)"><ellipse cx="0" cy="-60" rx="70" ry="60" fill="#14141C"/><ellipse cx="-60" cy="-20" rx="40" ry="30" fill="#14141C"/><ellipse cx="60" cy="-20" rx="40" ry="30" fill="#14141C"/><ellipse cx="0" cy="-120" rx="40" ry="30" fill="#14141C"/><path d="M-40,-10 q20,-40 0,-80" stroke="#BFE8FF" stroke-width="3" fill="none"/><path d="M0,0 q20,-40 0,-80" stroke="#BFE8FF" stroke-width="3" fill="none"/><path d="M40,-10 q20,-40 0,-80" stroke="#BFE8FF" stroke-width="3" fill="none"/><path d="M-70,-30 q20,-40 0,-80" stroke="#BFE8FF" stroke-width="3" fill="none"/><path d="M70,-30 q20,-40 0,-80" stroke="#BFE8FF" stroke-width="3" fill="none"/></g><text x="836" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="836" y="438" fill="#F3E7D3" font-size="13">수천 가닥 실이 엉킨 매듭, 사공의 배가 닿</text><text x="836" y="456" fill="#F3E7D3" font-size="13">지 못한 까닭</text><text x="836" y="482" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="836" y="500" fill="#F3E7D3" font-size="13">실을 하나씩 풀어 길을 낸다(제안)</text><rect x="20" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-24 한 구덩이의 두 진</text><text x="388" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">무리형 · 큰 무덤 속</text><g transform="translate(212.0,845)"><circle cx="-100" cy="-10" r="16" fill="#14141C"/><circle cx="-70" cy="-30" r="16" fill="#14141C"/><circle cx="-40" cy="-14" r="16" fill="#14141C"/><circle cx="-70" cy="-60" r="16" fill="#14141C"/><circle cx="100" cy="-10" r="16" fill="#14141C"/><circle cx="70" cy="-30" r="16" fill="#14141C"/><circle cx="40" cy="-14" r="16" fill="#14141C"/><circle cx="70" cy="-60" r="16" fill="#14141C"/><path d="M0,-130 L0,0" stroke="#E85C41" stroke-width="5" stroke-dasharray="8 6"/><ellipse cx="0" cy="8" rx="120" ry="30" fill="none" stroke="#14141C" stroke-width="6"/></g><text x="36" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="908" fill="#F3E7D3" font-size="13">번호로 불린 진과 이름으로 불린 진이 한 구</text><text x="36" y="926" fill="#F3E7D3" font-size="13">덩이에</text><text x="36" y="952" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="970" fill="#F3E7D3" font-size="13">몸 60기 규모를 흙덩이 단위로 표현. 두 </text><text x="36" y="988" fill="#F3E7D3" font-size="13">진의 빛깔을 가른다</text><rect x="420" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-25 반장 칠성의 백</text><text x="788" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">무리형 · 막힌 막장 안쪽</text><g transform="translate(612.0,845)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-34,0 L-26,-160 L26,-160 L34,0Z" fill="#14141C"/><path d="M-24,-166 Q0,-200 24,-166Z" fill="#14141C"/><path d="M-120,-140 L-90,-200 L120,-200 L90,-140 L120,0 L-120,0Z" fill="none" stroke="#14141C" stroke-width="10" stroke-dasharray="14 8"/><text x="0" y="-100" fill="#F3E7D3" font-size="26" text-anchor="middle">七</text></g><text x="436" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="908" fill="#F3E7D3" font-size="13">맨 마지막에 나가는 몸, 막힌 막장 안쪽</text><text x="436" y="934" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="952" fill="#F3E7D3" font-size="13">막장의 열셋 몸이 출구로 걸어간다. 틈으로 </text><text x="436" y="970" fill="#F3E7D3" font-size="13">새는 등불이 안내</text><rect x="820" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="832" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="836" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-26 두 겹 구덩이</text><text x="1188" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">덩어리형 · 석회 구덩이</text><g transform="translate(1012.0,845)"><ellipse cx="-50" cy="-30" rx="60" ry="28" fill="#14141C"/><ellipse cx="50" cy="-30" rx="60" ry="28" fill="#14141C"/><ellipse cx="-50" cy="-70" rx="50" ry="22" fill="#14141C"/><ellipse cx="50" cy="-70" rx="50" ry="22" fill="#14141C"/><path d="M-110,-20 L110,-20" stroke="#F3E7D3" stroke-width="3" opacity=".6"/><path d="M0,-110 L0,10" stroke="#C9B0FF" stroke-width="4"/></g><text x="836" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="836" y="908" fill="#F3E7D3" font-size="13">역병 마흔과 마흔, 위 겹은 해서·아래 겹은</text><text x="836" y="926" fill="#F3E7D3" font-size="13"> 흘림</text><text x="836" y="952" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="836" y="970" fill="#F3E7D3" font-size="13">두 겹의 글씨체를 달리 그려 위·아래를 가른</text><text x="836" y="988" fill="#F3E7D3" font-size="13">다(N-A7-4)</text><rect x="20" y="1030" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="1082" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="1060" fill="#D4A94E" font-size="16" font-weight="bold">B-27 서생 이명의 백</text><text x="388" y="1060" fill="#4FA8A0" font-size="12" text-anchor="end">기록형 · 성문 밖 구덩이</text><g transform="translate(212.0,1315)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-40,0 L-26,-160 L26,-160 L40,0Z" fill="#14141C" stroke="#E85C41" stroke-width="3"/><ellipse cx="0" cy="-176" rx="48" ry="9" fill="#14141C"/><rect x="-14" y="-206" width="28" height="30" fill="#14141C"/><path d="M-130,6 L130,6" stroke="#14141C" stroke-width="5"/><text x="-150" y="-20" fill="#14141C" font-size="22">明 月 日</text></g><text x="36" y="1360" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="1378" fill="#F3E7D3" font-size="13">흑월의 몸. 明에서 日이 지워지고 月만 남은</text><text x="36" y="1396" fill="#F3E7D3" font-size="13"> 이름</text><text x="36" y="1422" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="1440" fill="#F3E7D3" font-size="13">흙의 글씨: 바닥에 쓰인 이름마다 백이 일어</text><text x="36" y="1458" fill="#F3E7D3" font-size="13">난다. 처결 대기 10초</text><rect x="420" y="1030" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="1082" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="1060" fill="#D4A94E" font-size="16" font-weight="bold">B-28 벼루 밑의 손</text><text x="788" y="1060" fill="#4FA8A0" font-size="12" text-anchor="end">기록형 · 먹 앙금</text><g transform="translate(612.0,1315)"><ellipse cx="0" cy="-10" rx="120" ry="26" fill="#14141C"/><path d="M-30,-30 Q0,-150 30,-30 L20,-30 Q0,-110 -20,-30Z" fill="#14141C"/><path d="M-12,-100 q-10,-30 -30,-40 M12,-100 q10,-30 30,-40" stroke="#14141C" stroke-width="8" fill="none"/><ellipse cx="0" cy="-8" rx="80" ry="14" fill="none" stroke="#C9B0FF" stroke-width="3"/></g><text x="436" y="1360" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="1378" fill="#F3E7D3" font-size="13">벼루지기가 잊은 시 한 줄 — 옛 짝이 외우</text><text x="436" y="1396" fill="#F3E7D3" font-size="13">고 있었다</text><text x="436" y="1422" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="1440" fill="#F3E7D3" font-size="13">먹 앙금에서 손이 올라와 글자를 지운다</text><rect x="820" y="1030" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="832" y="1082" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="836" y="1060" fill="#D4A94E" font-size="16" font-weight="bold">B-29 백 년의 사잣밥 할미</text><text x="1188" y="1060" fill="#4FA8A0" font-size="12" text-anchor="end">기다림형 · 아랫목</text><g transform="translate(1012.0,1315)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-50,0 L-40,-110 L40,-110 L50,0Z" fill="#14141C"/><ellipse cx="0" cy="-130" rx="22" ry="24" fill="#14141C"/><ellipse cx="80" cy="-14" rx="28" ry="12" fill="#14141C"/><path d="M60,-20 L100,-20 L96,-44 L64,-44Z" fill="#F3E7D3" opacity=".9"/><path d="M-90,-8 q-30,10 -10,24" stroke="#14141C" stroke-width="8" fill="none"/></g><text x="836" y="1360" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="836" y="1378" fill="#F3E7D3" font-size="13">오지 않는 차사를 위해 백 년 상을 차렸다</text><text x="836" y="1404" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="836" y="1422" fill="#F3E7D3" font-size="13">차사가 사잣밥을 먹고 짚신을 신어야 눕는다(</text><text x="836" y="1440" fill="#F3E7D3" font-size="13">F69)</text><rect x="20" y="1500" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="1552" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="1530" fill="#D4A94E" font-size="16" font-weight="bold">B-30 첫 우물 — 어미의 백</text><text x="388" y="1530" fill="#4FA8A0" font-size="12" text-anchor="end">물형 · 첫 우물 밑</text><g transform="translate(212.0,1785)"><ellipse cx="0" cy="-30" rx="100" ry="40" fill="#14141C"/><ellipse cx="0" cy="-84" rx="60" ry="36" fill="#14141C"/><path d="M0,-200 L0,-110" stroke="#14141C" stroke-width="7"/><path d="M-14,-110 Q0,-90 14,-110" stroke="#14141C" stroke-width="7" fill="none"/><path d="M-100,-10 Q-60,16 0,10 Q60,16 100,-10" stroke="#BFE8FF" stroke-width="4" fill="none"/></g><text x="36" y="1830" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="1848" fill="#F3E7D3" font-size="13">새끼줄에 매달린 큰 몸. 이름보다 부름이 먼</text><text x="36" y="1866" fill="#F3E7D3" font-size="13">저</text><text x="36" y="1892" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="1910" fill="#F3E7D3" font-size="13">우물 벽을 따라 내려가며 싸운다. 부름이 백</text><text x="36" y="1928" fill="#F3E7D3" font-size="13">을 눕힌다(F66)</text><rect x="420" y="1500" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="1552" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="1530" fill="#D4A94E" font-size="16" font-weight="bold">B-31 나의 백</text><text x="788" y="1530" fill="#4FA8A0" font-size="12" text-anchor="end">차사형 · 물막이 골 소</text><g transform="translate(612.0,1785)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-36,0 L-24,-160 L24,-160 L36,0Z" fill="#14141C" stroke="#5FE3C0" stroke-width="3"/><ellipse cx="0" cy="-176" rx="48" ry="9" fill="#14141C"/><rect x="-14" y="-206" width="28" height="30" fill="#14141C"/><path d="M-12,-172 L-10,-150" stroke="#E85C41" stroke-width="3"/><circle cx="-96" cy="-210" r="7" fill="#D4A94E"/><circle cx="-64" cy="-210" r="7" fill="#D4A94E"/><circle cx="-32" cy="-210" r="7" fill="#D4A94E"/><circle cx="0" cy="-210" r="7" fill="#D4A94E"/><circle cx="32" cy="-210" r="7" fill="#D4A94E"/><circle cx="64" cy="-210" r="7" fill="#D4A94E"/><circle cx="96" cy="-210" r="7" fill="#D4A94E"/><ellipse cx="0" cy="6" rx="130" ry="34" fill="none" stroke="#BFE8FF" stroke-width="4" stroke-dasharray="10 6"/></g><text x="436" y="1830" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="1848" fill="#F3E7D3" font-size="13">열한 사내와 함께 둑에 오른 열두째 — 나</text><text x="436" y="1874" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="1892" fill="#F3E7D3" font-size="13">사슬 반경 8m. 40명당 일곱의 빛 하나씩</text><text x="436" y="1910" fill="#F3E7D3" font-size="13">(−12%). 처결 대기 15초</text></svg>