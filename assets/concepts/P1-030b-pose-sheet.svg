<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="sans-serif"><rect width="1000" height="640" fill="#16213E"/><rect y="560" width="1000" height="80" fill="#0F1729"/><text x="24" y="36" fill="#F3E7D3" font-size="22" font-weight="bold">P1-030 차사 실루엣 확정 시트 (포즈 4종 + 축소 테스트, 도형 초안)</text><text x="24" y="58" fill="#4FA8A0" font-size="12">원칙: 어느 포즈든 수평 챙 + 붉은 띠 + 자락이 읽혀야 한다. 포즈마다 단 하나의 신호색만 바뀐다.</text><g transform="translate(120,170) scale(.55)"><path d="M165,200 Q190,270 150,320" stroke="#F3E7D3" stroke-width="6" fill="none" stroke-dasharray="14 6"/><path d="M-34,40 L34,40 L70,165 L110,275 L50,355 L-60,355 L-120,275 L-70,165 Z" fill="#000"/><ellipse cx="0" cy="3" rx="92" ry="17" fill="#000"/><path d="M-30,3 L-26,-53 Q0,-69 26,-53 L30,3 Z" fill="#000"/><path d="M-34,40 L-120,135 L-135,195 L-90,185 L-62,135 Z" fill="#000"/><path d="M34,40 L110,120 L170,165 L150,203 L88,165 Z" fill="#000"/><path d="M-48,135 L48,135 L52,157 L-52,157 Z" fill="#E85C41"/><path d="M30,157 L40,215 L24,215 Z" fill="#E85C41"/><path d="M-120,115 q-14,-28 0,-50 q14,22 0,50" fill="#5FE3C0"/></g><text x="120" y="418" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">대기·이동</text><g transform="translate(350,170) scale(.55)"><path d="M220,30 Q330,-40 380,60" stroke="#F3E7D3" stroke-width="7" fill="none" stroke-dasharray="14 6"/><path d="M-34,40 L34,40 L70,165 L110,275 L50,355 L-60,355 L-120,275 L-70,165 Z" fill="#000"/><ellipse cx="0" cy="3" rx="92" ry="17" fill="#000"/><path d="M-30,3 L-26,-53 Q0,-69 26,-53 L30,3 Z" fill="#000"/><path d="M-34,40 L-120,135 L-135,195 L-90,185 L-62,135 Z" fill="#000"/><path d="M34,40 L120,40 L220,10 L225,50 L120,90 Z" fill="#000"/><path d="M-48,135 L48,135 L52,157 L-52,157 Z" fill="#E85C41"/><path d="M30,157 L40,215 L24,215 Z" fill="#E85C41"/><path d="M-120,115 q-14,-28 0,-50 q14,22 0,50" fill="#5FE3C0"/></g><text x="350" y="418" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">사슬 휘두름</text><g transform="translate(580,170) scale(.55)"><circle cx="0" cy="200" r="150" fill="#5FE3C0" opacity=".12"/><path d="M-34,40 L34,40 L70,165 L110,275 L50,355 L-60,355 L-120,275 L-70,165 Z" fill="#000"/><ellipse cx="0" cy="3" rx="92" ry="17" fill="#000"/><path d="M-30,3 L-26,-53 Q0,-69 26,-53 L30,3 Z" fill="#000"/><path d="M-34,40 L-80,120 L-30,190 L-10,150 Z" fill="#000"/><path d="M34,40 L80,120 L30,190 L10,150 Z" fill="#000"/><path d="M-48,135 L48,135 L52,157 L-52,157 Z" fill="#E85C41"/><path d="M30,157 L40,215 L24,215 Z" fill="#E85C41"/><circle cx="0" cy="165" r="24" fill="#5FE3C0"/></g><text x="580" y="418" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">천도 캐스팅</text><g transform="translate(810,170) scale(.55)"><circle cx="0" cy="130" r="190" fill="none" stroke="#E8683A" stroke-width="8" stroke-dasharray="18 10"/><circle cx="0" cy="130" r="190" fill="#E8683A" opacity=".12"/><path d="M-34,40 L34,40 L70,165 L110,275 L50,355 L-60,355 L-120,275 L-70,165 Z" fill="#000"/><ellipse cx="0" cy="3" rx="92" ry="17" fill="#000"/><path d="M-30,3 L-26,-53 Q0,-69 26,-53 L30,3 Z" fill="#000"/><path d="M-34,40 L-150,-10 L-190,20 L-130,70 L-62,100 Z" fill="#000"/><path d="M34,40 L150,-10 L190,20 L130,70 L62,100 Z" fill="#000"/><path d="M-48,135 L48,135 L52,157 L-52,157 Z" fill="#E85C41"/><path d="M30,157 L40,215 L24,215 Z" fill="#E85C41"/></g><text x="810" y="418" fill="#F3E7D3" font-size="13" text-anchor="middle" font-weight="bold">파혼 폭발</text><text x="120" y="436" fill="#4FA8A0" font-size="11" text-anchor="middle">혼불이 어깨 곁에 뜬다</text><text x="350" y="436" fill="#4FA8A0" font-size="11" text-anchor="middle">팔이 길게 뻗어 수평이 더 강해짐</text><text x="580" y="436" fill="#4FA8A0" font-size="11" text-anchor="middle">시야 60% 축소 연출 중심 = 청록 구체</text><text x="810" y="436" fill="#4FA8A0" font-size="11" text-anchor="middle">원형 폭발 3m = 주황, 팔 벌림</text><text x="24" y="490" fill="#D4A94E" font-size="14" font-weight="bold">축소 가독성 (모바일 쿼터뷰 실제 크기)</text><g transform="translate(60,500) scale(0.16)"><path d="M-34,40 L34,40 L70,165 L110,275 L50,355 L-60,355 L-120,275 L-70,165 Z" fill="#000"/><ellipse cx="0" cy="3" rx="92" ry="17" fill="#000"/><path d="M-30,3 L-26,-53 Q0,-69 26,-53 L30,3 Z" fill="#000"/><path d="M-34,40 L-120,135 L-135,195 L-90,185 L-62,135 Z" fill="#000"/><path d="M34,40 L110,120 L170,165 L150,203 L88,165 Z" fill="#000"/><path d="M-48,135 L48,135 L52,157 L-52,157 Z" fill="#E85C41"/><path d="M30,157 L40,215 L24,215 Z" fill="#E85C41"/></g><g transform="translate(460,500) scale(0.16)"><path d="M-34,40 L34,40 L70,165 L110,275 L50,355 L-60,355 L-120,275 L-70,165 Z" fill="#000"/><ellipse cx="0" cy="3" rx="92" ry="17" fill="#000"/><path d="M-30,3 L-26,-53 Q0,-69 26,-53 L30,3 Z" fill="#000"/><path d="M-34,40 L-120,135 L-135,195 L-90,185 L-62,135 Z" fill="#000"/><path d="M34,40 L110,120 L170,165 L150,203 L88,165 Z" fill="#000"/></g><g transform="translate(190,500) scale(0.1)"><path d="M-34,40 L34,40 L70,165 L110,275 L50,355 L-60,355 L-120,275 L-70,165 Z" fill="#000"/><ellipse cx="0" cy="3" rx="92" ry="17" fill="#000"/><path d="M-30,3 L-26,-53 Q0,-69 26,-53 L30,3 Z" fill="#000"/><path d="M-34,40 L-120,135 L-135,195 L-90,185 L-62,135 Z" fill="#000"/><path d="M34,40 L110,120 L170,165 L150,203 L88,165 Z" fill="#000"/><path d="M-48,135 L48,135 L52,157 L-52,157 Z" fill="#E85C41"/><path d="M30,157 L40,215 L24,215 Z" fill="#E85C41"/></g><g transform="translate(320,500) scale(0.06)"><path d="M-34,40 L34,40 L70,165 L110,275 L50,355 L-60,355 L-120,275 L-70,165 Z" fill="#000"/><ellipse cx="0" cy="3" rx="92" ry="17" fill="#000"/><path d="M-30,3 L-26,-53 Q0,-69 26,-53 L30,3 Z" fill="#000"/><path d="M-34,40 L-120,135 L-135,195 L-90,185 L-62,135 Z" fill="#000"/><path d="M34,40 L110,120 L170,165 L150,203 L88,165 Z" fill="#000"/><path d="M-48,135 L48,135 L52,157 L-52,157 Z" fill="#E85C41"/><path d="M30,157 L40,215 L24,215 Z" fill="#E85C41"/></g><text x="60" y="590" fill="#F3E7D3" font-size="11">96 / 60 / 36px — 36px에서도 챙(가로 막대)과 붉은 띠가 보이면 합격</text><text x="360" y="606" fill="#F3E7D3" font-size="11">띠 없는 검은 몸 = 붉은 띠가 정체성 신호임을 확인용(오른쪽)</text><text x="24" y="628" fill="#4FA8A0" font-size="11">일본 사신 대비는 P1-030-chasa-silhouette.svg 참조. 작품명 참조 없음.</text></svg>