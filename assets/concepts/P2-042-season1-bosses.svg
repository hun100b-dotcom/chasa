<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1990" width="1240" height="1990" font-family="sans-serif"><rect width="1240" height="1990" fill="#0F1729"/><text x="20" y="38" fill="#F3E7D3" font-size="22" font-weight="bold">시즌 1 보스 콘셉트 시트 — B-02, B-04~B-12 (10종)</text><text x="20" y="62" fill="#4FA8A0" font-size="12">B-01 나루 영감은 스프라이트로, B-03 서 의원은 P2-041 로 이미 있음. 도형 초안·실루엣 합격선 = 검정으로 칠해도 구별. 작품명 참조 없음.</text><rect x="20" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-02 월화</text><text x="388" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">의식형 · 폐당집</text><g transform="translate(212.0,375)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-40,0 L-26,-160 L26,-160 L40,0 Q0,12 -40,0Z" fill="#14141C"/><path d="M-26,-140 L-84,-90 L-70,-60 L-30,-100 Z M26,-140 L80,-110 L90,-80 L30,-100Z" fill="#14141C"/><path d="M-22,-170 L0,-205 L22,-170 Z" fill="#14141C"/><path d="M80,-110 L100,-170 M80,-110 L124,-150 M80,-110 L140,-120" stroke="#14141C" stroke-width="4"/><path d="M-70,-52 L-52,-52 L-56,-34 L-66,-34 Z" fill="#E85C41"/></g><text x="36" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="438" fill="#F3E7D3" font-size="13">끝내지 못한 열두 거리 굿, 엎어진 열두째 </text><text x="36" y="456" fill="#F3E7D3" font-size="13">잔</text><text x="36" y="482" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="500" fill="#F3E7D3" font-size="13">열두 잔 순서대로 장판이 열린다. 엎어진 잔</text><text x="36" y="518" fill="#F3E7D3" font-size="13"> 칸만 안전(제안)</text><rect x="420" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-04 흑월 차사 · 1차</text><text x="788" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">차사형 · 무덤골</text><g transform="translate(612.0,375)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-36,0 L-24,-160 L24,-160 L36,0 Q0,10 -36,0Z" fill="#14141C" stroke="#E85C41" stroke-width="3"/><ellipse cx="0" cy="-176" rx="48" ry="9" fill="#14141C"/><rect x="-14" y="-206" width="28" height="30" fill="#14141C"/><path d="M-12,-172 L-10,-150" stroke="#E85C41" stroke-width="3"/><path d="M30,-120 Q80,-130 90,-70" stroke="#BFE8FF" stroke-width="4" fill="none"/></g><text x="436" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="438" fill="#F3E7D3" font-size="13">처결 없음. 맺힘 50%에서 사슬을 내려놓고</text><text x="436" y="456" fill="#F3E7D3" font-size="13"> 한마디</text><text x="436" y="482" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="500" fill="#F3E7D3" font-size="13">천도와 파혼을 둘 다 쓴다. 그가 깨뜨린 폭</text><text x="436" y="518" fill="#F3E7D3" font-size="13">발이 내 얼룩을 키운다</text><rect x="820" y="90" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="832" y="142" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="836" y="120" fill="#D4A94E" font-size="16" font-weight="bold">B-05 기수 대돌</text><text x="1188" y="120" fill="#4FA8A0" font-size="12" text-anchor="end">무리형 · 붉은재 산성</text><g transform="translate(1012.0,375)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-30,0 L-22,-160 L22,-160 L30,0Z" fill="#14141C"/><path d="M-18,-168 Q0,-196 18,-168Z" fill="#14141C"/><rect x="38" y="-230" width="6" height="232" fill="#14141C"/><path d="M44,-228 L120,-214 L104,-196 L122,-180 L96,-172 L44,-176Z" fill="#14141C"/><path d="M60,-212 l14,0 M60,-200 l18,0" stroke="#F3E7D3" stroke-width="2"/></g><text x="836" y="420" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="836" y="438" fill="#F3E7D3" font-size="13">동료 서른일곱 이름을 외우다 하나씩 잊는다</text><text x="836" y="464" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="836" y="482" fill="#F3E7D3" font-size="13">이름 잊은 자리는 번호 병사로 바뀌어 더 사</text><text x="836" y="500" fill="#F3E7D3" font-size="13">나움(맺힘 +30%)</text><rect x="20" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-06 이름 없는 장수</text><text x="388" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">무리형 · 붉은재 군막</text><g transform="translate(212.0,845)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-56,0 L-60,-150 L-30,-168 L30,-168 L60,-150 L56,0Z" fill="#14141C"/><path d="M-60,-150 L-90,-110 M60,-150 L90,-110" stroke="#14141C" stroke-width="16"/><path d="M-24,-180 L0,-214 L24,-180Z" fill="#14141C"/><rect x="-40" y="-130" width="20" height="28" fill="#F3E7D3" opacity=".85"/><rect x="-12" y="-130" width="20" height="28" fill="#F3E7D3" opacity=".85"/><rect x="16" y="-130" width="20" height="28" fill="#F3E7D3" opacity=".85"/><path d="M-100,-100 L-104,-210" stroke="#14141C" stroke-width="6"/></g><text x="36" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="908" fill="#F3E7D3" font-size="13">부하를 번호로 불러 진을 짰다</text><text x="36" y="934" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="952" fill="#F3E7D3" font-size="13">호령 번호에 맞춰 대형이 바뀐다. 호령을 읽</text><text x="36" y="970" fill="#F3E7D3" font-size="13">으면 빈틈</text><rect x="420" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-07 갱도 반장 칠성</text><text x="788" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">무리형 · 쇳골 막장</text><g transform="translate(612.0,845)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-34,0 L-26,-160 L26,-160 L34,0Z" fill="#14141C"/><path d="M-24,-166 Q0,-200 24,-166Z" fill="#14141C"/><path d="M30,-130 L90,-210 M70,-222 L114,-196" stroke="#14141C" stroke-width="8"/><rect x="-70" y="-120" width="22" height="30" fill="#14141C"/><circle cx="-59" cy="-105" r="26" fill="#D4A94E" opacity=".25"/><text x="0" y="-100" fill="#F3E7D3" font-size="26" text-anchor="middle">七</text></g><text x="436" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="908" fill="#F3E7D3" font-size="13">열셋을 내보내고 자기 번호를 세지 않았다</text><text x="436" y="934" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="952" fill="#F3E7D3" font-size="13">광부 혼을 파혼하면 숫자가 틀려 광폭. 이 </text><text x="436" y="970" fill="#F3E7D3" font-size="13">전투만 잡몹 파혼이 손해</text><rect x="820" y="560" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="832" y="612" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="836" y="590" fill="#D4A94E" font-size="16" font-weight="bold">B-08 장부꾼 염씨</text><text x="1188" y="590" fill="#4FA8A0" font-size="12" text-anchor="end">기록형 · 쇳골 주인집</text><g transform="translate(1012.0,845)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-50,0 L-44,-112 L44,-112 L50,0 Z" fill="#14141C"/><ellipse cx="0" cy="-130" rx="22" ry="24" fill="#14141C"/><path d="M-96,-40 L0,-70 L96,-40 L96,-4 L0,-34 L-96,-4Z" fill="#14141C" stroke="#F3E7D3" stroke-width="2"/><text x="-40" y="-176" fill="#14141C" font-size="22">十四 三 九</text><path d="M54,-120 L90,-170" stroke="#14141C" stroke-width="5"/></g><text x="836" y="890" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="836" y="908" fill="#F3E7D3" font-size="13">죽음을 '손실 열넷'으로 적고 뒷장에 이름을</text><text x="836" y="926" fill="#F3E7D3" font-size="13"> 적었다</text><text x="836" y="952" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="836" y="970" fill="#F3E7D3" font-size="13">숫자 지뢰. 이름이 적힌 종이는 밟아도 무해</text><text x="836" y="988" fill="#F3E7D3" font-size="13">, 맺힘을 더 깎는다</text><rect x="20" y="1030" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="1082" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="1060" fill="#D4A94E" font-size="16" font-weight="bold">B-09 망부석 아낙</text><text x="388" y="1060" fill="#4FA8A0" font-size="12" text-anchor="end">기다림형 · 곶 끝</text><g transform="translate(212.0,1315)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-70,0 Q-76,-70 -30,-96 Q0,-110 30,-96 Q70,-70 70,0Z" fill="#14141C"/><path d="M-18,-90 L-14,-170 L18,-170 L14,-90Z" fill="#14141C"/><ellipse cx="0" cy="-184" rx="20" ry="22" fill="#14141C"/><path d="M-60,-30 q15,-14 30,0 t30,0 t30,0 t30,0" stroke="#BFE8FF" stroke-width="4" fill="none"/><path d="M14,-130 L50,-120 L44,-70 L12,-80Z" fill="#F3E7D3" opacity=".8"/></g><text x="36" y="1360" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="1378" fill="#F3E7D3" font-size="13">돌아오지 않는 배를 기다리다 바다에 들었다</text><text x="36" y="1404" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="1422" fill="#F3E7D3" font-size="13">줄지어 오는 파도 장판. 물 혼 천도로 파도</text><text x="36" y="1440" fill="#F3E7D3" font-size="13"> 한 줄이 약해진다</text><rect x="420" y="1030" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="432" y="1082" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="436" y="1060" fill="#D4A94E" font-size="16" font-weight="bold">B-10 만선호 선장</text><text x="788" y="1060" fill="#4FA8A0" font-size="12" text-anchor="end">무리형 · 난파 여울</text><g transform="translate(612.0,1315)"><g transform="rotate(-8)"><rect x="-110" y="0" width="220" height="14" fill="#14141C"/></g><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-30,0 L-22,-165 L22,-165 L30,0Z" fill="#14141C"/><path d="M-30,-170 L30,-170 L24,-182 L-24,-182Z" fill="#14141C"/><path d="M26,-120 Q90,-150 110,-60 L120,-30" stroke="#14141C" stroke-width="5" fill="none"/></g><text x="436" y="1360" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="436" y="1378" fill="#F3E7D3" font-size="13">배를 버리고 혼자 살아 돌아왔다</text><text x="436" y="1404" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="436" y="1422" fill="#F3E7D3" font-size="13">썰물 밤에만 열림. 기운 갑판, 줄 끊기 직</text><text x="436" y="1440" fill="#F3E7D3" font-size="13">선 장판</text><rect x="820" y="1030" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="832" y="1082" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="836" y="1060" fill="#D4A94E" font-size="16" font-weight="bold">B-11 다리 밑 왕초</text><text x="1188" y="1060" fill="#4FA8A0" font-size="12" text-anchor="end">무리형 · 도성 다리 밑</text><g transform="translate(1012.0,1315)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-50,0 L-34,-150 L34,-150 L50,0 L30,-12 L10,2 L-10,-12 L-30,2Z" fill="#14141C"/><ellipse cx="0" cy="-172" rx="22" ry="24" fill="#14141C"/><rect x="-24" y="-148" width="8" height="16" fill="#F3E7D3"/><rect x="-12" y="-142" width="8" height="16" fill="#F3E7D3"/><rect x="0" y="-136" width="8" height="16" fill="#F3E7D3"/><rect x="12" y="-142" width="8" height="16" fill="#F3E7D3"/><rect x="24" y="-148" width="8" height="16" fill="#F3E7D3"/></g><text x="836" y="1360" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="836" y="1378" fill="#F3E7D3" font-size="13">떠돌이들의 이름을 지어 부른 유일한 사람</text><text x="836" y="1404" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="836" y="1422" fill="#F3E7D3" font-size="13">별명을 부르면 혼이 일어나 협공. 낮에 들은</text><text x="836" y="1440" fill="#F3E7D3" font-size="13"> 별명 혼은 돌아선다</text><rect x="20" y="1500" width="384" height="454" rx="12" fill="#16213E" stroke="#4FA8A0" stroke-opacity=".4"/><rect x="32" y="1552" width="360" height="252" rx="8" fill="#F3E7D3" opacity=".92"/><text x="36" y="1530" fill="#D4A94E" font-size="16" font-weight="bold">B-12 흑월 차사 · 2차</text><text x="388" y="1530" fill="#4FA8A0" font-size="12" text-anchor="end">차사형 · 성문 밖</text><g transform="translate(212.0,1785)"><ellipse cx="0" cy="2" rx="46" ry="12" fill="#000" opacity=".25"/><path d="M-40,0 L-26,-160 L26,-160 L40,0 Q0,10 -40,0Z" fill="#14141C" stroke="#E85C41" stroke-width="3"/><circle cx="0" cy="-110" r="14" fill="#C9B0FF" opacity=".9"/><ellipse cx="0" cy="-176" rx="52" ry="10" fill="#14141C"/><rect x="-14" y="-210" width="28" height="34" fill="#14141C"/><path d="M-12,-172 L-10,-146" stroke="#E85C41" stroke-width="3"/><path d="M30,-130 Q120,-150 126,-60 M-30,-130 Q-120,-150 -126,-60" stroke="#BFE8FF" stroke-width="4" fill="none"/></g><text x="36" y="1830" fill="#D4A94E" font-size="12" font-weight="bold">한(恨)</text><text x="36" y="1848" fill="#F3E7D3" font-size="13">그 밤 구하지 못한 젊은이(=나)</text><text x="36" y="1874" fill="#E85C41" font-size="12" font-weight="bold">전투 신호</text><text x="36" y="1892" fill="#F3E7D3" font-size="13">사슬 양손. 천도 시 F9(내 정체). 기억</text><text x="36" y="1910" fill="#F3E7D3" font-size="13"> 보라 테두리가 시야 가장자리에 번진다</text></svg>